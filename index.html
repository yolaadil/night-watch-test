const TourEngine = {
  state: State.IDLE,
  target: null,
  currentStop: null,
  autoTimer: null,

  setState(next) {
    this.state = next;
    console.log('[Tour state]', next);
  },

  async prepare({forceNew = false} = {}) {
    await SAGEIntegration.init({profile: selectedProfile, forceNew});
    ensureDynamicPoiAnchor();
  },

  async recommendAndCue() {
    if (!SAGEIntegration.ready) await this.prepare();
    if (![State.IDLE, State.FREE].includes(this.state)) return;
    return SAGEIntegration.recommendNext();
  },

  async startCueChoices(poiIds) {
    clearTimeout(this.autoTimer);
    this.currentStop = null;
    this.target = null;
    this.setState(State.CUE);
    QuestCue.hideAll();
    setBlurOpacity(0, 150);
    await QuestCue.showMany(poiIds);
    if (!SAGEIntegration.activeRecommendation) return;
    this.setState(State.WAIT_GAZE);
  },

  async startCue(poiId) {
    clearTimeout(this.autoTimer);
    this.currentStop = SAGEIntegration.activeRecommendation;
    this.target = 'dynamicPoiAnchor';
    positionDynamicPoiAnchor(poiId);
    this.setState(State.CUE);

    QuestCue.hideAll();
    setBlurOpacity(0, 150);

    await QuestCue.show(poiId);
    if (!SAGEIntegration.activeRecommendation || SAGEIntegration.activeRecommendation.poi !== poiId) return;
    this.setState(State.WAIT_GAZE);
  },

  async openRecommendedTarget(poiId, node) {
    if (!SAGEIntegration.activeRecommendation) return;

    this.setState(State.ZOOMING);
    QuestCue.hideAll();
    showPrimaryHotspots(false);

    // Ensure the previous high-resolution POI has released its GPU resources
    // before creating the next focus region.
    clearFocusTiles();
    await loadFocusTilesForPoi(poiId);

    const shape = SAGEIntegration.pois.shapes[poiId];
    const bounds = SAGEIntegration.shapeBounds(shape);
    const center = SAGEIntegration.shapeCenter(shape);
    if (!bounds || !center) return;

    const localX = (center.x - 0.5) * WORLD_WIDTH;
    const localY = (0.5 - center.y) * WORLD_HEIGHT;
    const regionWorldW = Math.max(0.05, (bounds.x1 - bounds.x0) * WORLD_WIDTH);
    const regionWorldH = Math.max(0.05, (bounds.y1 - bounds.y0) * WORLD_HEIGHT);

    const zoomScale = THREE.MathUtils.clamp(
      Math.min(2.7 / regionWorldW, 2.25 / regionWorldH),
      1.55,
      3.2
    );

    const targetX = -localX * zoomScale;
    const targetY = 1.6 - localY * zoomScale;
    const visitNodes = SAGEIntegration.activeRecommendation.nodes || [node];

    SAGEIntegration.record('zoom_started', {
      node_ids: visitNodes.map(n => n.id),
      poi: poiId,
      zoom_scale: zoomScale,
      target_position: {x: targetX, y: targetY, z: -2.25}
    });

    paintingRoot.setAttribute(
      'animation__zoompos',
      `property: position; to: ${targetX} ${targetY} -2.25; dur: 850; easing: easeInOutQuad`
    );
    paintingRoot.setAttribute(
      'animation__zoomscale',
      `property: scale; to: ${zoomScale} ${zoomScale} ${zoomScale}; dur: 850; easing: easeInOutQuad`
    );

    setTimeout(() => {
      this.setState(State.STORY);
      setSageStatus('');
      backButton.style.display = 'block';

      SAGEIntegration.record('zoom_completed', {
        node_ids: visitNodes.map(n => n.id),
        poi: poiId,
        zoom_scale: zoomScale
      });

      let narrationIndex = 0;

      const playNextNarration = () => {
        const currentNode = visitNodes[narrationIndex];

        SAGEIntegration.record('fixed_narration_started', {
          poi: poiId,
          node_id: currentNode.id,
          narration_index: narrationIndex,
          narration_count: visitNodes.length
        });

        NarrationManager.playNode(currentNode, result => {
          if (result?.interrupted) {
            SAGEIntegration.finishNarration(currentNode, result);
            return;
          }

          SAGEIntegration.record('fixed_narration_finished', {
            poi: poiId,
            node_id: currentNode.id,
            narration_index: narrationIndex,
            narration_count: visitNodes.length
          });

          narrationIndex += 1;

          if (narrationIndex < visitNodes.length) {
            setTimeout(playNextNarration, 450);
          } else {
            SAGEIntegration.finishNarration(currentNode, {
              interrupted: false,
              ended: true
            });
          }
        });
      };

      playNextNarration();
    }, 900);
  },

  returnFromTarget(continueImmediately = false, callback = null) {
    if (![State.STORY, State.ZOOMING, State.RETURNING].includes(this.state)) {
      if (typeof callback === 'function') callback();
      return;
    }

    clearTimeout(this.autoTimer);
    if (NarrationManager.isPlaying()) NarrationManager.stop('manual_back');
    this.setState(State.RETURNING);
    backButton.style.display = 'none';

    SAGEIntegration.record('zoom_return_started', {
      poi: SAGEIntegration.activeRecommendation?.poi || null
    });

    paintingRoot.setAttribute(
      'animation__zoompos',
      'property: position; to: 0 1.6 -3; dur: 800; easing: easeInOutQuad'
    );
    paintingRoot.setAttribute(
      'animation__zoomscale',
      'property: scale; to: 1 1 1; dur: 800; easing: easeInOutQuad'
    );

    setTimeout(() => {
      clearFocusTiles();
      showPrimaryHotspots(false);
      this.target = null;
      this.currentStop = null;
      this.setState(State.FREE);
      SAGEIntegration.record('zoom_return_completed', {});

      if (typeof callback === 'function') callback();
      if (continueImmediately) this.recommendAndCue().catch(console.error);
    }, 830);
  },

  manualBack() {
    if (this.state === State.STORY && NarrationManager.node) {
      const node = NarrationManager.node;
      NarrationManager.interruptForDeparture();
      SAGEIntegration.record('manual_back', {node_id: node.id, poi: node.poi});
      return;
    }
    this.returnFromTarget(false);
  },

  finishTour() {
    if (this.tourEnding) return;
    this.tourEnding = true;

    QuestCue.hideAll();
    clearTimeout(SAGEIntegration.guidanceTimer);
    clearTimeout(SAGEIntegration.restTimer);
    setGazePointerInsideCue(false);

    this.target = null;
    this.currentStop = null;
    this.setState(State.FREE);

    SAGEIntegration.record('tour_completed', {
      visited_count: SAGEIntegration.visitedFixedStopIndices.size,
      total_stops: FIXED_STOPS.length
    });

    setSageStatus('Tour complete');

    const scene = document.querySelector('a-scene');
    const endOverlay = document.querySelector('#endTourOverlay');

    const showEndScreen = () => {
      if (endOverlay) endOverlay.style.display = 'flex';
      SAGEIntegration.record('end_screen_shown', {});
    };

    // Exit immersive VR first, then show the browser-based closing screen.
    // If the page is already outside VR, show the closing screen immediately.
    if (scene && scene.is && scene.is('vr-mode') && typeof scene.exitVR === 'function') {
      let shown = false;
      const onExit = () => {
        if (shown) return;
        shown = true;
        scene.removeEventListener('exit-vr', onExit);
        setTimeout(showEndScreen, 150);
      };

      scene.addEventListener('exit-vr', onExit);

      try {
        const result = scene.exitVR();
        if (result && typeof result.catch === 'function') {
          result.catch(() => {
            if (!shown) {
              shown = true;
              scene.removeEventListener('exit-vr', onExit);
              showEndScreen();
            }
          });
        }
      } catch (error) {
        console.warn('[VRPaint] Could not exit VR automatically', error);
        scene.removeEventListener('exit-vr', onExit);
        shown = true;
        showEndScreen();
      }

      // Safety fallback in case a browser fails to emit exit-vr.
      setTimeout(() => {
        if (!shown) {
          shown = true;
          scene.removeEventListener('exit-vr', onExit);
          showEndScreen();
        }
      }, 1800);
    } else {
      showEndScreen();
    }
  }
};

window.TourEngine = TourEngine;

function addHotspot(id) {
  const el = document.querySelector('#' + id);
  if (!el) return;

  // Desktop/controller fallback. Immersive gaze is handled by quest-gaze-select.
  el.addEventListener('click', () => {
    if (!pageReady || !currentLanguage) return;
    if (el.classList.contains('captainDetail')) {
      playNarration(id, standardNarration(id));
    } else {
      TourEngine.confirmGaze(id);
    }
  });
}

function showAudioStartOverlay() {
  languageOverlay.style.display = 'flex';
}

function hideAudioStartOverlay() {
  languageOverlay.style.display = 'none';
}

let experienceStarted = false;
let introStarted = false;

let pendingVrIntro = false;
let vrIntroRunning = false;
let audioPrimed = false;

function primeNarratorAudio() {
  // Must be called directly from a user gesture (profile click or VR button path).
  // It silently unlocks this HTMLAudioElement for later playback after the 5 s delay.
  if (audioPrimed || !selectedProfile) return;

  try {
    narrator.src = `audio/${selectedProfile}/NW001.mp3`;
    narrator.muted = true;
    narrator.volume = 0;

    const p = narrator.play();
    if (p && typeof p.then === 'function') {
      p.then(() => {
        narrator.pause();
        try { narrator.currentTime = 0; } catch {}
        narrator.muted = false;
        narrator.volume = 1;
        audioPrimed = true;
        console.log('[Audio] NW001 primed successfully.');
      }).catch(err => {
        narrator.muted = false;
        narrator.volume = 1;
        console.warn('[Audio] Priming was blocked:', err);
      });
    }
  } catch (err) {
    narrator.muted = false;
    narrator.volume = 1;
    console.warn('[Audio] Priming failed:', err);
  }
}

function startIntro() {
  if (introStarted) return;
  introStarted = true;
  hideAudioStartOverlay();

  (async () => {
    try {
      // Keep the known-working v14 preparation exactly here.
      await TourEngine.prepare({forceNew: true});
      pendingVrIntro = true;
      setSageStatus('Ready — enter VR to begin.');

      const sceneEl = document.querySelector('a-scene');
      if (sceneEl?.is('vr-mode') || sceneEl?.renderer?.xr?.isPresenting) {
        startVrIntroCountdown();
      }
    } catch (error) {
      console.error('[SAGE startup] prepare failed:', error);
      introStarted = false;
      pendingVrIntro = false;
      showAudioStartOverlay();
      const p = document.querySelector('#languageBox p');
      if (p) p.textContent = `Startup failed: ${error?.message || error}`;
    }
  })();
}

function startVrIntroCountdown() {
  if (!pendingVrIntro || vrIntroRunning) return;
  vrIntroRunning = true;
  pendingVrIntro = false;

  SAGEIntegration.record('vr_entered', {experience_time_origin: true});
  setSageStatus('VR ready — NW001 begins in 5 seconds…');

  setTimeout(() => {
    setSageStatus('Preparing experience…');

    let advanced = false;
    const advance = reason => {
      if (advanced) return;
      advanced = true;

      SAGEIntegration.record('intro_completed', {
        node_id: 'NW001',
        advance_reason: reason
      });

      TourEngine.setState(State.FREE);
      setSageStatus('NW001 complete — starting guided tour…');

      setTimeout(() => {
        TourEngine.recommendAndCue().catch(console.error);
      }, 1500);
    };

    playIntroSequence(() => advance('audio_complete'));

    // If Quest blocks the delayed audio despite priming, never freeze the tour.
    // Advance after 14 s so the first visual cue still appears.
    setTimeout(() => advance('intro_safety_timeout'), 14000);

  }, 5000);
}

function beginExperience() {
  showAudioStartOverlay();
}

document.querySelectorAll('.profileButton').forEach(button => {
  button.addEventListener('click', () => {
    selectedProfile = button.dataset.profile || 'general';
    selectedGuidanceMode = 'sage';

    // Unlock the narrator while this click still has user activation.
    primeNarratorAudio();

    const participantId = document.querySelector('#participantIdInput')?.value || 'P000';
    StudyLogger.start(participantId, selectedProfile);

    console.log(`[Profile selected] ${selectedProfile}; mode=${selectedGuidanceMode}; participant=${participantId}`);

    // Always begin a fresh engineering session when a profile is selected.
    try {
      localStorage.removeItem(`nightwatch-sage-fixed-v23:${selectedProfile}:${selectedGuidanceMode}`);
    } catch (e) {}

    setSageStatus('Playing NW001…');

    experienceStarted = true;
    pageReady = true;
    currentLanguage = 'en';
    gazeCursor.setAttribute('visible', true);
    showPrimaryHotspots(false);
    refreshVoices();

    document.querySelector('#exportLogButton').style.display = 'block';
    document.querySelector('#resetSessionButton').style.display = 'block';

    introStarted = false;
    startIntro();
  });
});

document.querySelector('#exportLogButton').addEventListener('click', () => {
  StudyLogger.exportJson();
});

document.querySelector('#resetSessionButton').addEventListener('click', () => {
  if (confirm('Reset the current Night Watch visitor session?')) {
    SAGEIntegration.resetSession();
  }
});


// Start automatically once the A-Frame scene is ready. If the browser blocks
// autoplay, a single Begin button appears to unlock audio.
const scene = document.querySelector('a-scene');
if (scene.hasLoaded) {
  beginExperience();
} else {
  scene.addEventListener('loaded', beginExperience, { once: true });
}

scene.addEventListener('enter-vr', () => {
  console.log('[SAGE] VR entered.');
  pageReady = true;
  currentLanguage = 'en';
  gazeCursor.setAttribute('visible', true);
  showPrimaryHotspots(false);

  if (!experienceStarted) {
    showAudioStartOverlay();
    return;
  }

  // Re-prime if needed while entering XR, then start the 5-second gate.
  primeNarratorAudio();
  setTimeout(startVrIntroCountdown, 100);
});


function syncPrimaryHotspotsToFocusRegions() {
  Object.entries(REGION).forEach(([id, config]) => {
    const hotspot = document.querySelector('#' + id);
    if (!hotspot) return;

    hotspot.setAttribute('width', config.focusW);
    hotspot.setAttribute('height', config.focusH);
  });
}

Object.keys(hotspotTexts).forEach(addHotspot);

window.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    TourEngine.manualBack();
  }
});

window.addEventListener('beforeunload', () => {
  if (window.StudyLogger && StudyLogger.startedAtMs !== null) {
    StudyLogger.logEvent('session_page_exit', {});
  }
});

window.addEventListener('load', () => {
  console.info('[SAGE fixed-sequence condition] v4 VR optimized');
  console.warn('[Night Watch] Marco normalized POIs are provisional. Use for pilot/engineering only until registered against the exact gigapixel master.');
  syncPrimaryHotspotsToFocusRegions();
  infoPanel.setAttribute('visible', false);
  setBlurOpacity(0, 0);

  // Do not reset pageReady, cursor visibility, or hotspot visibility here.
  // On Quest, A-Frame may finish loading before the window load event;
  // resetting these values afterward disables gaze and cue effects in VR.
});
