<script type="module">
import {
  DwellController,
  createVisitorState,
  markNarrationCompleted,
  selectRecommendation,
  makeEvent
} from './integration/nightwatch_runtime.mjs';

window.MarcoRuntimeReady = (async () => {
  const [corpusResponse, poiResponse] = await Promise.all([
    fetch('./corpus/nightwatch_nodes.json'),
    fetch('./integration/nightwatch_pois.json')
  ]);

  if (!corpusResponse.ok) {
    throw new Error(`Failed to load corpus: ${corpusResponse.status}`);
  }
  if (!poiResponse.ok) {
    throw new Error(`Failed to load POIs: ${poiResponse.status}`);
  }

  const corpus = await corpusResponse.json();
  const pois = await poiResponse.json();

  const api = {
    DwellController,
    createVisitorState,
    markNarrationCompleted,
    selectRecommendation,
    makeEvent,
    corpus,
    pois
  };

  window.MarcoRuntime = api;
  console.log(`[Marco runtime] loaded ${corpus.nodes.length} nodes and ${Object.keys(pois.shapes).length} POIs`);
  return api;
})().catch(error => {
  console.error('[Marco runtime] initialization failed', error);
  throw error;
});
</script>
<script>
AFRAME.registerComponent('blurred-copy', {
  schema: {
    source: { type: 'string' },
    radius: { type: 'number', default: 4 }
  },

init() {const image = new Image();image.crossOrigin = 'anonymous';

image.onload = () => {
  const scale = 0.32;
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

  const ctx = canvas.getContext('2d');
  ctx.filter = `blur(${this.data.radius}px)`;
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
  ctx.filter = 'none';

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;

  const apply = () => {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    mesh.material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false,
      toneMapped: false
    });
  };

  if (this.el.getObject3D('mesh')) {
    apply();
  } else {
    this.el.addEventListener('object3dset', apply, { once: true });
  }
};

image.src = this.data.source;

}});</script>

<script>
AFRAME.registerShader('tile-glow', {
  schema: {
    src: {type: 'map', is: 'uniform'},
    opacity: {type: 'number', is: 'uniform', default: 0.0},
    center: {type: 'vec2', is: 'uniform', default: {x: 0.5, y: 0.5}},
    radius: {type: 'vec2', is: 'uniform', default: {x: 0.2, y: 0.2}},
    tileRect: {type: 'vec4', is: 'uniform', default: {x: 0, y: 0, z: 1, w: 1}}
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D src;
    uniform float opacity;
    uniform vec2 center;
    uniform vec2 radius;
    uniform vec4 tileRect;
    varying vec2 vUv;
    void main() {
      vec4 tex = texture2D(src, vUv);
      vec2 globalUv = vec2(
        mix(tileRect.x, tileRect.z, vUv.x),
        mix(tileRect.y, tileRect.w, 1.0 - vUv.y)
      );
      vec2 d = (globalUv - center) / max(radius, vec2(0.0001));
      float dist = length(d);
      float mask = 1.0 - smoothstep(0.45, 1.0, dist);
      float glow = opacity * mask;
      vec3 lifted = tex.rgb * 1.18 + vec3(0.055, 0.040, 0.010);
      gl_FragColor = vec4(lifted, tex.a * glow);
    }
  `
});



// Render an entity on a dedicated Three.js camera layer.
// Layer 0 remains the normal binocular scene; layer 1 is reserved for
// the temporary museum cue that will be visible to one eye only in WebXR.
AFRAME.registerComponent('render-layer', {
  schema: { layer: { type: 'int', default: 1 } },

  init() {
    this.applyLayer = this.applyLayer.bind(this);
    this.el.addEventListener('object3dset', this.applyLayer);
    this.el.addEventListener('model-loaded', this.applyLayer);
    this.applyLayer();
  },

  applyLayer() {
    const layer = this.data.layer;
    this.el.object3D.traverse(object => object.layers.set(layer));
  },

  remove() {
    this.el.removeEventListener('object3dset', this.applyLayer);
    this.el.removeEventListener('model-loaded', this.applyLayer);
  }
});

// Approach B: both eyes see the original painting, while only one eye sees
// the existing warm, brightened tile overlay. Nothing else in the scene is
// rendered monocularly. Outside immersive VR, the cue remains binocular so
// desktop testing still works normally.
AFRAME.registerComponent('dichoptic-cue-camera', {
  schema: {
    layer: { type: 'int', default: 1 },

    // left/right force a fixed cue eye.
    // auto selects the eye from the target's horizontal direction
    // relative to the user's CURRENT headset viewing direction.
    eye: { type: 'string', default: 'auto' },

    // Prevent rapid eye switching when the target is almost centered.
    // The existing eye is retained inside this angular dead-zone.
    deadzone: { type: 'number', default: 2.5 }
  },

  init() {
    this.wasPresenting = false;
    this.currentCueEye = 'left';
    this.lastTargetId = null;
  },

  getAdaptiveCueEye(baseCamera) {
    const mode = String(this.data.eye || 'auto').toLowerCase();

    if (mode === 'left' || mode === 'right') {
      return mode;
    }

    const targetId =
      window.TourEngine &&
      (window.TourEngine.state === 'CUE' || window.TourEngine.state === 'WAIT_GAZE')
        ? window.TourEngine.target
        : null;

    if (!targetId) return this.currentCueEye;

    const targetEl = document.querySelector('#' + targetId);
    if (!targetEl || !targetEl.object3D) return this.currentCueEye;

    // Position of the target in world coordinates.
    const targetWorld = new THREE.Vector3();
    targetEl.object3D.getWorldPosition(targetWorld);

    // Convert the target to the current headset-camera coordinate system.
    // In camera space: +X = right, -X = left, and forward is -Z.
    const targetLocal = targetWorld.clone();
    baseCamera.worldToLocal(targetLocal);

    const horizontalAngle =
      THREE.MathUtils.radToDeg(Math.atan2(targetLocal.x, -targetLocal.z));

    let desiredEye = this.currentCueEye;

    if (horizontalAngle > this.data.deadzone) {
      // Target lies to the RIGHT of the user's current viewing direction.
      desiredEye = 'right';
    } else if (horizontalAngle < -this.data.deadzone) {
      // Target lies to the LEFT of the user's current viewing direction.
      desiredEye = 'left';
    }

    if (desiredEye !== this.currentCueEye || targetId !== this.lastTargetId) {
      console.log(
        `[SAGE dichoptic] target=${targetId}, horizontalAngle=${horizontalAngle.toFixed(1)}°, cueEye=${desiredEye}`
      );
    }

    this.currentCueEye = desiredEye;
    this.lastTargetId = targetId;
    return desiredEye;
  },

  tick() {
    const scene = this.el.sceneEl;
    const renderer = scene && scene.renderer;
    const cameraEl = document.querySelector('#mainCamera');
    const baseCamera = cameraEl && cameraEl.getObject3D('camera');
    if (!renderer || !baseCamera || !renderer.xr) return;

    const cueLayer = this.data.layer;
    baseCamera.layers.enable(0);

    if (!renderer.xr.isPresenting) {
      // Desktop preview remains binocular so the cue can still be debugged.
      baseCamera.layers.enable(cueLayer);
      if (this.wasPresenting) renderer.xr.cameraAutoUpdate = true;
      this.wasPresenting = false;
      return;
    }

    this.wasPresenting = true;

    // Update the WebXR stereo cameras ourselves. A-Frame/Three.js normally
    // copies the parent layer mask to both eye cameras immediately before
    // rendering, which would otherwise overwrite our per-eye masks.
    renderer.xr.cameraAutoUpdate = false;
    renderer.xr.updateCamera(baseCamera);

    const xrCamera = renderer.xr.getCamera(baseCamera);
    const eyes = xrCamera && xrCamera.cameras;
    if (!eyes || eyes.length < 2) return;

    // The parent ArrayCamera must contain both the normal scene and cue layer.
    baseCamera.layers.enable(cueLayer);
    xrCamera.layers.enable(0);
    xrCamera.layers.enable(cueLayer);

    // Start with the cue disabled in both physical eyes.
    eyes.forEach(camera => {
      camera.layers.enable(0);
      camera.layers.disable(cueLayer);
    });

    // Adaptive rule:
    // target right of current view -> cue in right eye
    // target left  of current view -> cue in left eye
    const cueEye = this.getAdaptiveCueEye(baseCamera);
    const cueIndex = cueEye === 'right' ? 1 : 0;
    eyes[cueIndex].layers.enable(cueLayer);
  },

  remove() {
    const renderer = this.el.sceneEl && this.el.sceneEl.renderer;
    if (renderer && renderer.xr) renderer.xr.cameraAutoUpdate = true;
  }
});

AFRAME.registerComponent('quest-gaze-select', {
  init() {
    this.hitTarget = null;
    this.lastQuaternion = new THREE.Quaternion();
    this.lastSampleMs = performance.now();
    this.angularVelocity = 0;

    this.el.addEventListener('raycaster-intersection', e => {
      const intersections = (e.detail && e.detail.intersections) || [];
      const hit = intersections.find(i =>
        i.object &&
        i.object.el &&
        i.object.el.classList.contains('hotspot')
      );
      this.hitTarget = hit && hit.object.el ? hit.object.el : null;
    });

    const clear = () => {
      this.hitTarget = null;
    };
    this.el.addEventListener('raycaster-intersection-cleared', clear);
    this.el.addEventListener('mouseleave', clear);
  },

  tick(time) {
    if (!window.TourEngine || !window.SAGEIntegration) return;

    // Estimate headset angular velocity so Marco's dwell controller can
    // reject transient passes across the ROI.
    const camera = document.querySelector('#mainCamera');
    const object3D = camera && camera.object3D;
    if (object3D) {
      const q = object3D.getWorldQuaternion(new THREE.Quaternion());
      const dt = Math.max(1, time - this.lastSampleMs) / 1000;
      const dot = Math.min(1, Math.max(-1, Math.abs(q.dot(this.lastQuaternion))));
      const angle = 2 * Math.acos(dot);
      this.angularVelocity = THREE.MathUtils.radToDeg(angle) / dt;
      this.lastQuaternion.copy(q);
      this.lastSampleMs = time;
    }

    const targetId = window.TourEngine.target;
    if (!targetId) return;

    const hitId = this.hitTarget && this.hitTarget.id;
    const insideInner = hitId === targetId;

    // V1 uses the existing validated hotspot as both inner and outer ROI.
    // Marco's departureGraceMs still provides short hysteresis. A separately
    // expanded outer geometry can be added after the normalized POIs are
    // registered against the gigapixel master.
    window.SAGEIntegration.updateDwell({
      nowMs: performance.now(),
      domTargetId: targetId,
      insideOuter: insideInner,
      insideInner,
      angularVelocityDegPerSec: this.angularVelocity
    });
  }
});
</script>

<script>
const infoPanel = document.querySelector('#infoPanel');
const welcomePanel = document.querySelector('#welcomePanel');
const gazeCursor = document.querySelector('#gazeCursor');
const languageOverlay = document.querySelector('#languageOverlay');
const cueLayer = document.querySelector('#cueLayer');
const focusLayer = document.querySelector('#focusLayer');
const paintingBlur = document.querySelector('#paintingBlur');
const paintingRoot = document.querySelector('#paintingRoot');
const mainCamera = document.querySelector('#mainCamera');
const cameraRig = document.querySelector('#cameraRig');
const backButton = document.querySelector('#backButton');

const IMAGE_WIDTH = 15354;
const IMAGE_HEIGHT = 13230;
const WORLD_WIDTH = 4;
const WORLD_HEIGHT = 3.45;
const TILE_SIZE = 254;
const TILE_OVERLAP = 1;
const TILE_FOLDER = 'tiles';
const MAX_LEVEL = 14;
const GAZE_MS = 2000;

// ---------------------------------------------------------------------------
// Marco narrative/runtime integration
// ---------------------------------------------------------------------------

// Map Marco's normalized semantic POIs onto the currently validated SAGE
// rendering targets. Unsupported provisional POIs remain in the corpus but
// are temporarily marked non-guideable until their geometry is registered
// against the exact gigapixel master.
const MARCO_POI_TO_DOM = Object.freeze({
  captain: 'captain',
  lieutenant: 'lieutenant',
  girl: 'girl',
  dog: 'dog',
  drummer: 'drummer',
  standard: 'flag',
  musketeer_left: 'musketeer',
  left_group: 'leftGroup',
  right_group: 'rightGroup',
  architecture: 'backgroundArch'
});

const SAGEIntegration = {
  runtime: null,
  corpus: null,
  pois: null,
  visitorState: null,
  dwell: null,
  activeRecommendation: null,
  profile: 'general',
  log: [],
  recommendationToken: 0,
  ready: false,

  async init() {
    const runtime = await window.MarcoRuntimeReady;
    this.runtime = runtime;
    this.corpus = runtime.corpus;
    this.pois = runtime.pois;
    this.visitorState = runtime.createVisitorState(this.profile);
    this.dwell = new runtime.DwellController({
      orientationMs: 400,
      activationMs: 2200,
      departureGraceMs: 400,
      maxAngularVelocityDegPerSec: 15
    });
    this.ready = true;
    console.log('[SAGE integration] Marco runtime ready');
    return this;
  },

  record(type, data = {}) {
    const event = this.runtime && this.runtime.makeEvent
      ? this.runtime.makeEvent(type, data)
      : {type, timestamp_ms: performance.now(), ...data};
    this.log.push(event);
    console.log('[SAGE event]', event);
    return event;
  },

  poiCenter(shape) {
    if (!shape) return null;
    if (shape.type === 'ellipse') return {x: shape.cx, y: shape.cy};
    if (shape.type === 'rect') return {
      x: shape.x + shape.width / 2,
      y: shape.y + shape.height / 2
    };
    if (shape.type === 'polygon' && shape.points && shape.points.length) {
      const sum = shape.points.reduce((a, p) => ({x: a.x + p[0], y: a.y + p[1]}), {x: 0, y: 0});
      return {x: sum.x / shape.points.length, y: sum.y / shape.points.length};
    }
    return null;
  },

  angularFeatures(poiId) {
    const shape = this.pois && this.pois.shapes && this.pois.shapes[poiId];
    const center = this.poiCenter(shape);
    if (!center || !mainCamera || !paintingRoot) {
      return {angle: 90, visibility: 0, convenience: 0};
    }

    // Normalized painting coordinate -> paintingRoot local coordinate.
    const local = new THREE.Vector3(
      (center.x - 0.5) * WORLD_WIDTH,
      (0.5 - center.y) * WORLD_HEIGHT,
      0
    );
    paintingRoot.object3D.localToWorld(local);

    const cameraPos = new THREE.Vector3();
    const cameraQuat = new THREE.Quaternion();
    mainCamera.object3D.getWorldPosition(cameraPos);
    mainCamera.object3D.getWorldQuaternion(cameraQuat);

    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(cameraQuat).normalize();
    const toTarget = local.sub(cameraPos).normalize();
    const angle = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(forward.dot(toTarget), -1, 1)));

    const visibility = angle <= 32 ? 1 : angle <= 55 ? 0.55 : 0.2;
    const convenience = THREE.MathUtils.clamp(1 - angle / 90, 0, 1);
    return {angle, visibility, convenience};
  },

  buildSpatialState() {
    const spatial = {};
    const shapes = (this.pois && this.pois.shapes) || {};

    Object.keys(shapes).forEach(poiId => {
      const domId = MARCO_POI_TO_DOM[poiId];
      const supported = !!(domId && REGION[domId] && document.querySelector('#' + domId));
      const features = this.angularFeatures(poiId);

      spatial[poiId] = {
        zoomValid: supported,
        angularSizeValid: supported,
        currentlyIntersected: false,
        inCooldown: false,
        guideable: supported,
        currentVisibility: features.visibility,
        spatialConvenience: features.convenience,
        targetEccentricityDeg: features.angle
      };
    });
    return spatial;
  },

  featureProvider(node, poiSpatial) {
    return {
      currentVisibility: poiSpatial.currentVisibility ?? 0,
      spatialConvenience: poiSpatial.spatialConvenience ?? 0,
      guidanceFatigue: 0
    };
  },

  async recommendNext() {
    if (!this.ready) await this.init();
    if (this.activeRecommendation || TourEngine.state === State.STORY || TourEngine.state === State.ZOOMING) {
      return null;
    }

    const token = ++this.recommendationToken;
    const spatial = this.buildSpatialState();
    const result = this.runtime.selectRecommendation(
      this.corpus.nodes,
      this.visitorState,
      spatial,
      (node, poiSpatial) => this.featureProvider(node, poiSpatial)
    );

    this.record('candidate_set_computed', {
      candidate_count: result.candidates.length,
      candidates: result.candidates.map(c => ({
        node_id: c.node.id,
        poi: c.node.poi,
        score: c.score,
        contributions: c.contributions
      }))
    });

    if (!result.selected) {
      console.warn('[SAGE integration] no eligible supported recommendation');
      TourEngine.target = null;
      TourEngine.setState(State.FREE);
      return null;
    }

    const selected = result.selected;
    const domId = MARCO_POI_TO_DOM[selected.node.poi];
    if (!domId || token !== this.recommendationToken) return null;

    this.activeRecommendation = {
      node: selected.node,
      domId,
      score: selected.score,
      contributions: selected.contributions,
      onsetMs: performance.now(),
      eccentricityDeg: spatial[selected.node.poi]?.targetEccentricityDeg ?? null
    };

    // Preload the prerecorded General narration during guidance.
    const narrationPreload = new Audio(`audio/${selected.node.id}.mp3`);
    narrationPreload.preload = 'auto';
    narrationPreload.load();

    this.visitorState.activeNode = selected.node.id;
    this.visitorState.lastGuidanceTime = performance.now() / 1000;

    this.record('recommendation_selected', {
      node_id: selected.node.id,
      poi: selected.node.poi,
      dom_target: domId,
      score: selected.score,
      contributions: selected.contributions,
      target_eccentricity_deg: this.activeRecommendation.eccentricityDeg
    });

    this.dwell.reset();
    await TourEngine.startCue(domId);

    this.record('guidance_onset', {
      node_id: selected.node.id,
      poi: selected.node.poi,
      dom_target: domId,
      target_eccentricity_deg: this.activeRecommendation.eccentricityDeg
    });

    return this.activeRecommendation;
  },

  updateDwell({nowMs, domTargetId, insideOuter, insideInner, angularVelocityDegPerSec}) {
    if (!this.ready || !this.activeRecommendation || !this.dwell) return;
    if (domTargetId !== this.activeRecommendation.domId) return;
    if (TourEngine.state !== State.CUE && TourEngine.state !== State.WAIT_GAZE) return;

    const result = this.dwell.update({
      nowMs,
      poi: this.activeRecommendation.node.poi,
      insideOuter,
      insideInner,
      angularVelocityDegPerSec
    });

    for (const event of result.events) {
      this.record(event.type, {
        node_id: this.activeRecommendation.node.id,
        poi: this.activeRecommendation.node.poi,
        dom_target: this.activeRecommendation.domId,
        controller_at_ms: event.at,
        angular_velocity_deg_s: angularVelocityDegPerSec
      });

      if (event.type === 'orientation_confirmed') {
        // SAGE's guidance task ends here.
        QuestCue.hideAll();

        const acquisitionMs = nowMs - this.activeRecommendation.onsetMs;
        this.record('target_acquired', {
          node_id: this.activeRecommendation.node.id,
          poi: this.activeRecommendation.node.poi,
          acquisition_ms: acquisitionMs,
          target_eccentricity_deg: this.activeRecommendation.eccentricityDeg
        });
      }

      if (event.type === 'activation_started') {
        this.visitorState.narrationState = 'activating';
      }

      if (event.type === 'activation_completed') {
        const rec = this.activeRecommendation;
        this.visitorState.started.add(rec.node.id);
        this.visitorState.narrationState = 'playing';
        TourEngine.openRecommendedTarget(rec.domId, rec.node);
      }
    }
  },

  narrationCompleted(node) {
    const seconds = performance.now() / 1000;
    this.runtime.markNarrationCompleted(this.visitorState, node, seconds);

    this.record('narration_completed', {
      node_id: node.id,
      poi: node.poi,
      profile: this.profile
    });

    this.activeRecommendation = null;
    if (this.dwell) this.dwell.reset();
  },

  narrationText(node) {
    const profile = this.profile in node.texts ? this.profile : 'general';
    return node.texts[profile].text;
  },

  async scheduleNext(delayMs = 8000) {
    const token = this.recommendationToken;
    await new Promise(resolve => setTimeout(resolve, delayMs));
    if (token !== this.recommendationToken) return;
    if (TourEngine.state === State.FREE || TourEngine.state === State.WAIT_GAZE) {
      this.recommendNext().catch(console.error);
    }
  }
};

function levelDimensions(level) {
  const scale = Math.pow(2, level - MAX_LEVEL);
  return {
    width: Math.ceil(IMAGE_WIDTH * scale),
    height: Math.ceil(IMAGE_HEIGHT * scale)
  };
}

function tileGeometry(level, col, row) {
  const dims = levelDimensions(level);
  const coreX = col * TILE_SIZE;
  const coreY = row * TILE_SIZE;

  if (coreX >= dims.width || coreY >= dims.height) return null;

  const columns = Math.ceil(dims.width / TILE_SIZE);
  const rows = Math.ceil(dims.height / TILE_SIZE);

  const leftOverlap = col === 0 ? 0 : TILE_OVERLAP;
  const topOverlap = row === 0 ? 0 : TILE_OVERLAP;
  const rightOverlap = col === columns - 1 ? 0 : TILE_OVERLAP;
  const bottomOverlap = row === rows - 1 ? 0 : TILE_OVERLAP;

  const fileX = Math.max(0, coreX - leftOverlap);
  const fileY = Math.max(0, coreY - topOverlap);
  const fileW = Math.min(
    TILE_SIZE + leftOverlap + rightOverlap,
    dims.width - fileX
  );
  const fileH = Math.min(
    TILE_SIZE + topOverlap + bottomOverlap,
    dims.height - fileY
  );

  return {
    dims,
    fileX,
    fileY,
    fileW,
    fileH,
    worldW: fileW / dims.width * WORLD_WIDTH,
    worldH: fileH / dims.height * WORLD_HEIGHT,
    centerX: ((fileX + fileW / 2) / dims.width - 0.5) * WORLD_WIDTH,
    centerY: (0.5 - (fileY + fileH / 2) / dims.height) * WORLD_HEIGHT
  };
}

function hotspotCenter(id) {
  const hotspot = document.querySelector('#' + id);
  const pos = hotspot.getAttribute('position');
  return { x: pos.x, y: pos.y - 1.6 };
}

function tileRangeFor(id, width, height, offsetX = 0, offsetY = 0) {
  const baseCenter = hotspotCenter(id);
  const center = {
    x: baseCenter.x + offsetX,
    y: baseCenter.y + offsetY
  };
  const dims = levelDimensions(MAX_LEVEL);

  const leftPx = Math.max(
    0,
    ((center.x - width / 2) / WORLD_WIDTH + 0.5) * dims.width
  );
  const rightPx = Math.min(
    dims.width,
    ((center.x + width / 2) / WORLD_WIDTH + 0.5) * dims.width
  );
  const topPx = Math.max(
    0,
    (0.5 - (center.y + height / 2) / WORLD_HEIGHT) * dims.height
  );
  const bottomPx = Math.min(
    dims.height,
    (0.5 - (center.y - height / 2) / WORLD_HEIGHT) * dims.height
  );

  return {
    center,
    startCol: Math.floor(leftPx / TILE_SIZE),
    endCol: Math.floor(Math.max(0, rightPx - 1) / TILE_SIZE),
    startRow: Math.floor(topPx / TILE_SIZE),
    endRow: Math.floor(Math.max(0, bottomPx - 1) / TILE_SIZE)
  };
}

function animateOpacity(object3D, target, duration = 450) {
  if (!object3D) return;

  const materials = [];
  object3D.traverse(node => {
    if (node.material) materials.push(node.material);
  });

  const startValues = materials.map(material => material.opacity || 0);
  const started = performance.now();

  function frame(now) {
    const progress = Math.min(1, (now - started) / duration);
    const eased = progress * progress * (3 - 2 * progress);

    materials.forEach((material, index) => {
      material.transparent = true;
      material.opacity =
        startValues[index] +
        (target - startValues[index]) * eased;
      material.needsUpdate = true;
    });

    if (progress < 1) requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

function animateTint(object3D, targetHex, duration = 850) {
  return new Promise(resolve => {
    if (!object3D) {
      resolve();
      return;
    }

    const materials = [];
    object3D.traverse(node => {
      if (node.material && node.material.color) {
        materials.push(node.material);
      }
    });

    if (!materials.length) {
      resolve();
      return;
    }

    const target = new THREE.Color(targetHex);
    const starts = materials.map(material => material.color.clone());
    const started = performance.now();

    function frame(now) {
      const progress = Math.min(1, (now - started) / duration);
      const eased =
        progress < 0.5
          ? 2 * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 2) / 2;

      materials.forEach((material, index) => {
        material.color.copy(starts[index]).lerp(target, eased);
        material.needsUpdate = true;
      });

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        resolve();
      }
    }

    requestAnimationFrame(frame);
  });
}

function setBlurOpacity(target, duration = 450) {
  const mesh = paintingBlur.getObject3D('mesh');
  if (!mesh || !mesh.material) return;

  const start = mesh.material.opacity || 0;
  const started = performance.now();

  function frame(now) {
    const progress = Math.min(1, (now - started) / duration);
    const eased = progress * progress * (3 - 2 * progress);

    mesh.material.opacity =
      start + (target - start) * eased;
    mesh.material.needsUpdate = true;

    if (progress < 1) requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

const QuestCue = {
  activeId: null,
  token: 0,
  group: null,

  hideAll() {
    this.token += 1;
    this.activeId = null;
    if (this.group && this.group.parentNode) this.group.parentNode.removeChild(this.group);
    this.group = null;
    document.querySelectorAll('[id$="Halo"]').forEach(el => el.setAttribute('visible', false));
  },

  async show(id) {
    this.hideAll();
    const localToken = ++this.token;
    this.activeId = id;
    const cfg = REGION[id];
    const range = tileRangeFor(id, cfg.cueW, cfg.cueH, cfg.cueOffsetX || 0, cfg.cueOffsetY || 0);
    const dims = levelDimensions(MAX_LEVEL);
    const center = range.center;
    const centerUv = {
      x: center.x / WORLD_WIDTH + 0.5,
      y: 0.5 - center.y / WORLD_HEIGHT
    };
    const radiusUv = {
      x: cfg.cueW / WORLD_WIDTH / 2,
      y: cfg.cueH / WORLD_HEIGHT / 2
    };

    const group = document.createElement('a-entity');
    group.dataset.target = id;
    cueLayer.appendChild(group);
    this.group = group;

    const tiles = [];
    for (let row = range.startRow; row <= range.endRow; row++) {
      for (let col = range.startCol; col <= range.endCol; col++) {
        const geometry = tileGeometry(MAX_LEVEL, col, row);
        if (!geometry) continue;
        tiles.push({col, row, geometry, url: `${TILE_FOLDER}/${MAX_LEVEL}/${col}_${row}.jpeg`});
      }
    }

    const available = [];
    const results = await Promise.all(tiles.map(t => preloadImage(t.url)));
    tiles.forEach((t, i) => { if (results[i].ok) available.push(t); });
    if (localToken !== this.token || this.activeId !== id) return;

    const planes = [];
    for (const tile of available) {
      const g = tile.geometry;
      const plane = document.createElement('a-plane');
      plane.setAttribute('width', g.worldW);
      plane.setAttribute('height', g.worldH);
      plane.setAttribute('position', `${g.centerX} ${g.centerY} 0.032`);
      const u0 = g.fileX / dims.width;
      const v0 = g.fileY / dims.height;
      const u1 = (g.fileX + g.fileW) / dims.width;
      const v1 = (g.fileY + g.fileH) / dims.height;
      plane.setAttribute('render-layer', 'layer: 1');
      plane.setAttribute('material', {
        shader: 'tile-glow',
        src: tile.url,
        opacity: 0.03,
        center: `${centerUv.x} ${centerUv.y}`,
        radius: `${radiusUv.x} ${radiusUv.y}`,
        tileRect: `${u0} ${v0} ${u1} ${v1}`,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        side: 'double'
      });
      group.appendChild(plane);
      plane.addEventListener('object3dset', () => {
        plane.object3D.traverse(object => object.layers.set(1));
      });
      planes.push(plane);
    }

    // Keep the museum-style cue active continuously until gaze confirms
    // the target. QuestCue.hideAll() removes this group as soon as the
    // interaction is locked, which stops the animation automatically.
    planes.forEach((plane, index) => {
      plane.setAttribute(`animation__continuousglow${index}`, {
        property: 'material.opacity',
        from: 0.08,
        to: 0.48,
        dur: 900,
        easing: 'easeInOutSine',
        dir: 'alternate',
        loop: true
      });
    });
  }
};

function clearFocusTiles() {
  while (focusLayer.firstChild) focusLayer.removeChild(focusLayer.firstChild);
}
function preloadImage(url) {
  return new Promise(resolve => {
    const image = new Image();
    image.crossOrigin = 'anonymous';
    image.onload = () => resolve({ok:true,url});
    image.onerror = () => resolve({ok:false,url});
    image.src = url;
  });
}
async function loadFocusTiles(id) {
  clearFocusTiles();
  const cfg = REGION[id];
  const range = tileRangeFor(id, cfg.focusW, cfg.focusH);
  const tiles = [];
  for (let row = range.startRow; row <= range.endRow; row++) {
    for (let col = range.startCol; col <= range.endCol; col++) {
      const geometry = tileGeometry(MAX_LEVEL, col, row);
      if (geometry) tiles.push({col,row,geometry,url:`${TILE_FOLDER}/${MAX_LEVEL}/${col}_${row}.jpeg`});
    }
  }
  const results = await Promise.all(tiles.map(t => preloadImage(t.url)));
  const available = tiles.filter((t,i) => results[i].ok);
  const group = document.createElement('a-entity');
  group.dataset.target = id;
  focusLayer.appendChild(group);
  const promises = available.map(tile => new Promise(resolve => {
    const plane = document.createElement('a-image');
    plane.setAttribute('src', tile.url);
    plane.setAttribute('width', tile.geometry.worldW);
    plane.setAttribute('height', tile.geometry.worldH);
    plane.setAttribute('position', `${tile.geometry.centerX} ${tile.geometry.centerY} 0.018`);
    plane.setAttribute('material', 'shader: flat; transparent: true; opacity: 0; depthTest: false; depthWrite: false; side: double; toneMapped: false');
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(plane); } };
    plane.addEventListener('materialtextureloaded', finish, {once:true});
    plane.addEventListener('loaded', () => setTimeout(finish, 700), {once:true});
    group.appendChild(plane);
  }));
  const planes = await Promise.all(promises);
  planes.forEach((plane,index) => plane.setAttribute(`animation__focusfade${index}`, 'property: material.opacity; from: 0; to: 1; dur: 450; easing: easeOutQuad'));
  console.log(`[Focus tiles] ${id}: ${planes.length}/${tiles.length} loaded`);
}

function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = window.speechSynthesis.getVoices();
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
}

function stopSpeech() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  speechUtterance = null;
}

function speak(text, onEnd = null) {
  if (!('speechSynthesis' in window) || !text) return;

  stopSpeech();
  refreshVoices();

  const prefix = currentLanguage === 'ar' ? 'ar' : 'en';
  const preferred = voices.find(v =>
    v.lang.toLowerCase().startsWith(prefix) &&
    /aria|jenny|samantha|daniel|salma|hamed|google/i.test(v.name)
  ) || voices.find(v => v.lang.toLowerCase().startsWith(prefix));

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = currentLanguage === 'ar' ? 'ar-SA' : 'en-US';
  utterance.rate = currentLanguage === 'ar' ? 0.88 : 0.92;
  utterance.pitch = 0.97;
  if (preferred) utterance.voice = preferred;

  if (typeof onEnd === 'function') {
    let completed = false;
    const finish = () => {
      if (completed) return;
      completed = true;
      onEnd();
    };

    utterance.onend = finish;
    utterance.onerror = finish;
  }

  speechUtterance = utterance;
  window.speechSynthesis.speak(utterance);
}

const AUDIO_FILES = {
  intro: 'intro.mp3',
  captain: 'captain.mp3',
  lieutenant: 'lieutenant.mp3',
  girl: 'girl.mp3'
};

const narrator = new Audio();
narrator.preload = 'auto';
let activeNarrationToken = 0;

function stopNarration() {
  activeNarrationToken += 1;
  narrator.pause();
  narrator.removeAttribute('src');
  narrator.load();
  stopSpeech();
}

function estimatedNarrationMs(text) {
  const words = String(text || '').trim().split(/\s+/).filter(Boolean).length;
  return Math.max(4500, words * 430);
}

function playNarration(id, text, onEnd = null, options = {}) {
  const token = ++activeNarrationToken;
  narrator.pause();
  narrator.currentTime = 0;
  stopSpeech();

  const finish = () => {
    if (token !== activeNarrationToken) return;
    if (typeof onEnd === 'function') onEnd();
  };

  const file = /^NW\d{3}$/.test(id)
    ? `audio/${id}.mp3`
    : AUDIO_FILES[id];
  if (file) {
    narrator.src = file;
    narrator.onended = finish;
    narrator.onerror = () => {
      console.error('[Narration] audio file failed to load:', file, 'for id:', id);
      if (options.isIntro) {
        showAudioStartOverlay();
      } else if ('speechSynthesis' in window) {
        speak(text, finish);
      } else {
        setTimeout(finish, estimatedNarrationMs(text));
      }
    };

    const promise = narrator.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(error => {
        console.warn('Audio playback was blocked:', error);
        if (options.isIntro) {
          showAudioStartOverlay();
        } else if ('speechSynthesis' in window) {
          speak(text, finish);
        } else {
          setTimeout(finish, estimatedNarrationMs(text));
        }
      });
    }
    return;
  }

  // Temporary fallback while the remaining MP3 files are being added.
  if ('speechSynthesis' in window) {
    speak(text, finish);
  } else {
    setTimeout(finish, estimatedNarrationMs(text));
  }
}

function standardNarration(id) {
  const raw = hotspotTexts[id][currentLanguage];
  return raw.replace(/\n+/g, ' ');
}

function makeCanvasTexture(text, language, width = 520, height = 190) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = 'rgba(17,17,17,0.72)';
  roundRect(ctx, 0, 0, width, height, 26);
  ctx.fill();

  ctx.fillStyle = 'white';
  ctx.textBaseline = 'top';

  if (language === 'ar') {
    ctx.direction = 'rtl';
    ctx.textAlign = 'right';
    ctx.font = '22px Tahoma, Arial, sans-serif';
    drawWrappedText(ctx, text, width - 38, 26, width - 68, 36);
  } else {
    ctx.direction = 'ltr';
    ctx.textAlign = 'left';
    ctx.font = '21px Arial, sans-serif';
    drawWrappedText(ctx, text, 38, 26, width - 68, 36);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  return texture;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
  const paragraphs = text.split('\n');

  for (const paragraph of paragraphs) {
    if (paragraph.trim() === '') {
      y += lineHeight * 0.65;
      continue;
    }

    const words = paragraph.split(' ');
    let line = '';

    for (let i = 0; i < words.length; i++) {
      const testLine = line + words[i] + ' ';

      if (ctx.measureText(testLine).width > maxWidth && i > 0) {
        ctx.fillText(line.trim(), x, y);
        line = words[i] + ' ';
        y += lineHeight;
      } else {
        line = testLine;
      }
    }

    ctx.fillText(line.trim(), x, y);
    y += lineHeight;
  }
}

function setPanelText(panel, text, language) {
  const mesh = panel.getObject3D('mesh');
  if (!mesh) return;

  mesh.material.map = makeCanvasTexture(text, language);
  mesh.material.transparent = true;
  mesh.material.needsUpdate = true;
}

function showInfo(id) { /* descriptions removed */ }

function hideInfo() { }

function showPrimaryHotspots(show) {
  document.querySelectorAll('.hotspot').forEach(el => {
    if (el.classList.contains('captainDetail')) {
      el.setAttribute('visible', false);
    } else {
      el.setAttribute('visible', show);
    }
  });
}

function showNestedDetails(id) {
  document.querySelectorAll('.captainDetail').forEach(el => {
    el.setAttribute('visible', id === 'captain');
  });
}

const TourEngine = {
  state: State.IDLE,
  index: 0,
  target: null,
  pulseToken: 0,
  autoTimer: null,

  setState(next) {
    this.state = next;
    console.log('[Tour state]', next);
  },

  async startCue(id) {
    clearTimeout(this.autoTimer);
    this.pulseToken += 1;
    const token = this.pulseToken;

    this.target = id;
    this.setState(State.CUE);
    QuestCue.hideAll();
    setBlurOpacity(0, 150);

    await QuestCue.show(id);
    if (token !== this.pulseToken) return;
    this.setState(State.WAIT_GAZE);
  },

  confirmGaze(id) {
    if (this.state === State.FREE) {
      this.openTarget(id, false);
      return;
    }

    if (
      (this.state === State.CUE || this.state === State.WAIT_GAZE) &&
      id === this.target
    ) {
      this.openTarget(id, true);
    }
  },

  async openRecommendedTarget(id, node) {
    this.pulseToken += 1;
    this.setState(State.ZOOMING);
    clearTimeout(this.autoTimer);
    setBlurOpacity(0, 250);
    QuestCue.hideAll();
    showPrimaryHotspots(false);
    await loadFocusTiles(id);

    const hotspot = document.querySelector('#' + id);
    if (!hotspot) {
      console.error('[SAGE integration] missing DOM hotspot for', id);
      return;
    }
    const pos = hotspot.getAttribute('position');

    setTimeout(() => {
      const localX = pos.x;
      const localY = pos.y - 1.6;
      const zoomScale = 1.85;
      const targetX = -localX * zoomScale;
      const targetY = 1.6 - localY * zoomScale;
      paintingRoot.setAttribute('animation__zoompos', `property: position; to: ${targetX} ${targetY} -2.25; dur: 850; easing: easeInOutQuad`);
      paintingRoot.setAttribute('animation__zoomscale', `property: scale; to: ${zoomScale} ${zoomScale} ${zoomScale}; dur: 850; easing: easeInOutQuad`);
    }, 120);

    setTimeout(() => {
      this.setState(State.STORY);
      showNestedDetails(id);
      backButton.style.display = 'block';

      const narration = SAGEIntegration.narrationText(node);

      // Use the corpus node ID so old per-character MP3s do not accidentally
      // override Marco's audience-specific narration. Speech synthesis remains
      // the current fallback until node-specific recordings are added.
      playNarration(node.id, narration, () => {
        SAGEIntegration.narrationCompleted(node);

        this.autoTimer = setTimeout(() => {
          if (this.state === State.STORY && this.target === id) {
            this.returnFromTarget(false, true);
          }
        }, 900);
      });
    }, 850);
  },

  async openTarget(id, orderedStory) {
    this.pulseToken += 1;
    this.setState(State.ZOOMING);
    clearTimeout(this.autoTimer);
    setBlurOpacity(0, 250);
    QuestCue.hideAll();
    showPrimaryHotspots(false);
    await loadFocusTiles(id);

    const hotspot = document.querySelector('#' + id);
    const pos = hotspot.getAttribute('position');

    setTimeout(() => {
      const localX = pos.x;
      const localY = pos.y - 1.6;
      const zoomScale = 1.85;
      const targetX = -localX * zoomScale;
      const targetY = 1.6 - localY * zoomScale;
      paintingRoot.setAttribute('animation__zoompos', `property: position; to: ${targetX} ${targetY} -2.25; dur: 850; easing: easeInOutQuad`);
      paintingRoot.setAttribute('animation__zoomscale', `property: scale; to: ${zoomScale} ${zoomScale} ${zoomScale}; dur: 850; easing: easeInOutQuad`);
    }, 120);

    setTimeout(() => {
      this.setState(State.STORY);
      
      showNestedDetails(id);
      backButton.style.display = 'block';

      const narration = orderedStory
        ? STORY_TEXT[id][currentLanguage]
        : standardNarration(id);

      if (orderedStory) {
        playNarration(id, narration, () => {
          this.autoTimer = setTimeout(() => {
            if (this.state === State.STORY && this.target === id) {
              this.returnFromTarget(true);
            }
          }, 900);
        });
      } else {
        playNarration(id, narration);
      }
    }, 850);
  },

  returnFromTarget(advanceStory, marcoContinue = false) {
    if (
      this.state !== State.STORY &&
      this.state !== State.ZOOMING
    ) return;

    clearTimeout(this.autoTimer);
    stopNarration();
    this.setState(State.RETURNING);
    
    showNestedDetails(null);
    backButton.style.display = 'none';

    paintingRoot.setAttribute('animation__zoompos', 'property: position; to: 0 1.6 -3; dur: 800; easing: easeInOutQuad');
    paintingRoot.setAttribute('animation__zoomscale', 'property: scale; to: 1 1 1; dur: 800; easing: easeInOutQuad');

    setTimeout(() => {
      clearFocusTiles();
      showPrimaryHotspots(true);

      if (advanceStory) {
        this.index += 1;

        if (this.index >= STORY_ORDER.length) {
          this.target = null;
          this.setState(State.FREE);
          QuestCue.hideAll();
          setBlurOpacity(0, 250);

          const ending =
            currentLanguage === 'ar'
              ? 'انتهت القصة الموجهة. يمكنك الآن استكشاف أي عنصر بحرية.'
              : 'The guided story is complete. You can now explore any element freely.';

          playNarration('ending', ending);

          setTimeout(() => {
            
          }, 4500);
        } else {
          this.startCue(STORY_ORDER[this.index]);
        }
      } else {
        this.setState(State.FREE);
        this.target = null;

        if (marcoContinue) {
          SAGEIntegration.scheduleNext(8000).catch(console.error);
        }
      }
    }, 830);
  },

  manualBack() {
    this.returnFromTarget(false);
  },

  wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
};

window.TourEngine = TourEngine;

function addHotspot(id) {
  const el = document.querySelector('#' + id);
  if (!el) return;

  // Desktop/controller fallback. Immersive gaze is handled by quest-gaze-select.
  el.addEventListener('click', () => {
    if (!pageReady || !currentLanguage) return;
    if (el.classList.contains('captainDetail')) {
      playNarration(id, standardNarration(id));
    } else if (SAGEIntegration.activeRecommendation && id === TourEngine.target) {
      // Desktop convenience: simulate a complete stable acquisition.
      const now = performance.now();
      SAGEIntegration.updateDwell({
        nowMs: now,
        domTargetId: id,
        insideOuter: true,
        insideInner: true,
        angularVelocityDegPerSec: 0
      });
      SAGEIntegration.updateDwell({
        nowMs: now + 450,
        domTargetId: id,
        insideOuter: true,
        insideInner: true,
        angularVelocityDegPerSec: 0
      });
      SAGEIntegration.updateDwell({
        nowMs: now + 2700,
        domTargetId: id,
        insideOuter: true,
        insideInner: true,
        angularVelocityDegPerSec: 0
      });
    } else {
      TourEngine.confirmGaze(id);
    }
  });
}

function showAudioStartOverlay() {
  languageOverlay.style.display = 'flex';
}

function hideAudioStartOverlay() {
  languageOverlay.style.display = 'none';
}

let experienceStarted = false;
let introStarted = false;

function startIntro() {
  if (introStarted) return;
  introStarted = true;
  hideAudioStartOverlay();

  // NW001 is the corpus overview narration ("Meet The Night Watch").
  // Using the prerecorded node audio avoids dependence on the old intro.mp3.
  const introNodeId = 'NW001';

  (async () => {
    try {
      await SAGEIntegration.init();

      const introNode = SAGEIntegration.corpus.nodes.find(n => n.id === introNodeId);
      const introText = introNode
        ? SAGEIntegration.narrationText(introNode)
        : 'Welcome to The Night Watch.';

      playNarration(introNodeId, introText, () => {
        // Treat the overview narration as completed so the recommendation graph
        // can progress normally and NW001 is not repeated later.
        if (introNode && !SAGEIntegration.visitorState.completed.has(introNodeId)) {
          SAGEIntegration.runtime.markNarrationCompleted(
            SAGEIntegration.visitorState,
            introNode,
            performance.now() / 1000
          );
          SAGEIntegration.record('narration_completed', {
            node_id: introNode.id,
            poi: introNode.poi,
            profile: SAGEIntegration.profile,
            role: 'intro'
          });
        }

        // Give the visitor two seconds with the full painting before guidance.
        setTimeout(() => {
          SAGEIntegration.recommendNext().catch(error => {
            console.error('[SAGE integration] could not start recommendation flow', error);
          });
        }, 2000);
      });
    } catch (error) {
      console.error('[SAGE integration] intro initialization failed', error);
      // Keep the app from silently stalling if runtime files cannot load.
      languageOverlay.style.display = 'flex';
      const p = document.querySelector('#languageBox p');
      if (p) p.textContent = 'The experience could not load its runtime files. Check the browser console.';
    }
  })();
}

function beginExperience() {
  if (experienceStarted) return;
  experienceStarted = true;
  pageReady = true;
  currentLanguage = 'en';
  gazeCursor.setAttribute('visible', true);
  showPrimaryHotspots(true);
  refreshVoices();

  // Keep the painting still for two seconds before playing the introduction.
  setTimeout(startIntro, 2000);
}

const startExperienceButton = document.querySelector('#startExperienceButton');
startExperienceButton.addEventListener('click', () => {
  if (!experienceStarted) {
    experienceStarted = true;
    pageReady = true;
    currentLanguage = 'en';
    gazeCursor.setAttribute('visible', true);
    showPrimaryHotspots(true);
    refreshVoices();
  }
  introStarted = false;
  startIntro();
});

// Start automatically once the A-Frame scene is ready. If the browser blocks
// autoplay, a single Begin button appears to unlock audio.
const scene = document.querySelector('a-scene');
if (scene.hasLoaded) {
  beginExperience();
} else {
  scene.addEventListener('loaded', beginExperience, { once: true });
}

scene.addEventListener('enter-vr', () => {
  console.log('[Dichoptic cue] SAGE adaptive eye mode active: cue eye follows target side relative to current view.');
  pageReady = true;
  currentLanguage = 'en';
  gazeCursor.setAttribute('visible', true);
  showPrimaryHotspots(true);

  // Keep the current tour state when entering VR. Only start the intro if
  // the experience has not begun yet.
  if (!experienceStarted) {
    beginExperience();
  }
});


function syncPrimaryHotspotsToFocusRegions() {
  Object.entries(REGION).forEach(([id, config]) => {
    const hotspot = document.querySelector('#' + id);
    if (!hotspot) return;

    hotspot.setAttribute('width', config.focusW);
    hotspot.setAttribute('height', config.focusH);
  });
}

Object.keys(hotspotTexts).forEach(addHotspot);

window.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    TourEngine.manualBack();
  }
});

window.addEventListener('load', () => {
  syncPrimaryHotspotsToFocusRegions();
  infoPanel.setAttribute('visible', false);
  setBlurOpacity(0, 0);

  // Do not reset pageReady, cursor visibility, or hotspot visibility here.
  // On Quest, A-Frame may finish loading before the window load event;
  // resetting these values afterward disables gaze and cue effects in VR.
});
</script>
