<script>
AFRAME.registerComponent('blurred-copy', {
  schema: {
    source: { type: 'string' },
    radius: { type: 'number', default: 4 }
  },

init() {const image = new Image();image.crossOrigin = 'anonymous';

image.onload = () => {
  const scale = 0.32;
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

  const ctx = canvas.getContext('2d');
  ctx.filter = `blur(${this.data.radius}px)`;
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
  ctx.filter = 'none';

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;

  const apply = () => {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    mesh.material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false,
      toneMapped: false
    });
  };

  if (this.el.getObject3D('mesh')) {
    apply();
  } else {
    this.el.addEventListener('object3dset', apply, { once: true });
  }
};

image.src = this.data.source;

}});</script>

<script>
AFRAME.registerShader('tile-glow', {
  // Small transparent filled glow. No ring, no dark center, no tile look.
  schema: {
    opacity: {type: 'number', is: 'uniform', default: 0.12}
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float opacity;
    varying vec2 vUv;

    void main() {
      vec2 p = vUv - vec2(0.5);
      float r = length(p) / 0.7071;

      // Filled glow: strongest in the center, smoothly fades to zero.
      // There is intentionally NO ring and NO dark hole.
      float glow = 1.0 - smoothstep(0.05, 1.0, r);
      glow = pow(glow, 1.35);

      vec3 glowColor = vec3(1.0, 0.88, 0.40); // warmer yellow glow (#FFE066 approx.)
      gl_FragColor = vec4(glowColor, opacity * glow);
    }
  `
});


// Render an entity on a dedicated Three.js camera layer.
// Layer 0 remains the normal binocular scene; layer 1 is reserved for
// the temporary museum cue that will be visible to one eye only in WebXR.
AFRAME.registerComponent('render-layer', {
  schema: { layer: { type: 'int', default: 1 } },

  init() {
    this.applyLayer = this.applyLayer.bind(this);
    this.el.addEventListener('object3dset', this.applyLayer);
    this.el.addEventListener('model-loaded', this.applyLayer);
    this.applyLayer();
  },

  applyLayer() {
    const layer = this.data.layer;
    this.el.object3D.traverse(object => object.layers.set(layer));
  },

  remove() {
    this.el.removeEventListener('object3dset', this.applyLayer);
    this.el.removeEventListener('model-loaded', this.applyLayer);
  }
});

// Approach B: both eyes see the original painting, while only one eye sees
// the existing warm, brightened tile overlay. Nothing else in the scene is
// rendered monocularly. Outside immersive VR, the cue remains binocular so
// desktop testing still works normally.
AFRAME.registerComponent('dichoptic-cue-camera', {
  schema: {
    layer: { type: 'int', default: 1 },

    // left/right force a fixed cue eye.
    // auto selects the eye from the target's horizontal direction
    // relative to the user's CURRENT headset viewing direction.
    eye: { type: 'string', default: 'auto' },

    // Prevent rapid eye switching when the target is almost centered.
    // The existing eye is retained inside this angular dead-zone.
    deadzone: { type: 'number', default: 2.5 }
  },

  init() {
    this.wasPresenting = false;
    this.currentCueEye = 'left';
    this.lastTargetId = null;
  },

  getAdaptiveCueEye(baseCamera) {
    const mode = String(this.data.eye || 'auto').toLowerCase();

    if (mode === 'left' || mode === 'right') {
      return mode;
    }

    const targetId =
      window.TourEngine &&
      (window.TourEngine.state === 'CUE' || window.TourEngine.state === 'WAIT_GAZE')
        ? window.TourEngine.target
        : null;

    if (!targetId) return this.currentCueEye;

    const targetEl = document.querySelector('#' + targetId);
    if (!targetEl || !targetEl.object3D) return this.currentCueEye;

    // Position of the target in world coordinates.
    const targetWorld = new THREE.Vector3();
    targetEl.object3D.getWorldPosition(targetWorld);

    // Convert the target to the current headset-camera coordinate system.
    // In camera space: +X = right, -X = left, and forward is -Z.
    const targetLocal = targetWorld.clone();
    baseCamera.worldToLocal(targetLocal);

    const horizontalAngle =
      THREE.MathUtils.radToDeg(Math.atan2(targetLocal.x, -targetLocal.z));

    let desiredEye = this.currentCueEye;

    if (horizontalAngle > this.data.deadzone) {
      // Target lies to the RIGHT of the user's current viewing direction.
      desiredEye = 'right';
    } else if (horizontalAngle < -this.data.deadzone) {
      // Target lies to the LEFT of the user's current viewing direction.
      desiredEye = 'left';
    }

    if (desiredEye !== this.currentCueEye || targetId !== this.lastTargetId) {
      console.log(
        `[SAGE dichoptic] target=${targetId}, horizontalAngle=${horizontalAngle.toFixed(1)}°, cueEye=${desiredEye}`
      );
    }

    this.currentCueEye = desiredEye;
    this.lastTargetId = targetId;
    return desiredEye;
  },

  tick() {
    const scene = this.el.sceneEl;
    const renderer = scene && scene.renderer;
    const cameraEl = document.querySelector('#mainCamera');
    const baseCamera = cameraEl && cameraEl.getObject3D('camera');
    if (!renderer || !baseCamera || !renderer.xr) return;

    const cueLayer = this.data.layer;
    baseCamera.layers.enable(0);

    if (!renderer.xr.isPresenting) {
      // Desktop preview remains binocular so the cue can still be debugged.
      baseCamera.layers.enable(cueLayer);
      if (this.wasPresenting) renderer.xr.cameraAutoUpdate = true;
      this.wasPresenting = false;
      return;
    }

    this.wasPresenting = true;

    // Update the WebXR stereo cameras ourselves. A-Frame/Three.js normally
    // copies the parent layer mask to both eye cameras immediately before
    // rendering, which would otherwise overwrite our per-eye masks.
    renderer.xr.cameraAutoUpdate = false;
    renderer.xr.updateCamera(baseCamera);

    const xrCamera = renderer.xr.getCamera(baseCamera);
    const eyes = xrCamera && xrCamera.cameras;
    if (!eyes || eyes.length < 2) return;

    // The parent ArrayCamera must contain both the normal scene and cue layer.
    baseCamera.layers.enable(cueLayer);
    xrCamera.layers.enable(0);
    xrCamera.layers.enable(cueLayer);

    // Start with the cue disabled in both physical eyes.
    eyes.forEach(camera => {
      camera.layers.enable(0);
      camera.layers.disable(cueLayer);
    });

    // Adaptive rule:
    // target right of current view -> cue in right eye
    // target left  of current view -> cue in left eye
    const cueEye = this.getAdaptiveCueEye(baseCamera);
    const cueIndex = cueEye === 'right' ? 1 : 0;
    eyes[cueIndex].layers.enable(cueLayer);
  },

  remove() {
    const renderer = this.el.sceneEl && this.el.sceneEl.renderer;
    if (renderer && renderer.xr) renderer.xr.cameraAutoUpdate = true;
  }
});

AFRAME.registerComponent('quest-gaze-select', {
  init() {
    this.lastQuaternion = new THREE.Quaternion();
    this.lastSampleMs = performance.now();
    this.angularVelocity = 0;
  },

  tick(time) {
    if (!window.SAGEIntegration || !paintingRoot || !mainCamera) return;

    const cameraObj = mainCamera.object3D;
    const q = cameraObj.getWorldQuaternion(new THREE.Quaternion());

    const dt = Math.max(1, time - this.lastSampleMs) / 1000;
    const dot = Math.min(1, Math.max(-1, Math.abs(q.dot(this.lastQuaternion))));
    const angle = 2 * Math.acos(dot);
    this.angularVelocity = THREE.MathUtils.radToDeg(angle) / dt;
    this.lastQuaternion.copy(q);
    this.lastSampleMs = time;

    // Robust head-ray -> painting intersection.
    // Avoid relying on A-Frame UV intersection events, which can become
    // unreliable on Quest once the dichoptic cue is visible.
    const worldOrigin = new THREE.Vector3();
    cameraObj.getWorldPosition(worldOrigin);

    const worldDirection = new THREE.Vector3(0, 0, -1)
      .applyQuaternion(q)
      .normalize();

    const localOrigin = paintingRoot.object3D.worldToLocal(worldOrigin.clone());
    const worldPointAlongRay = worldOrigin.clone().add(worldDirection);
    const localPointAlongRay = paintingRoot.object3D.worldToLocal(worldPointAlongRay);
    const localDirection = localPointAlongRay.sub(localOrigin).normalize();

    let uv = null;

    if (Math.abs(localDirection.z) > 1e-6) {
      const t = -localOrigin.z / localDirection.z;

      if (t > 0) {
        const hit = localOrigin.clone().add(localDirection.multiplyScalar(t));

        const x = hit.x / WORLD_WIDTH + 0.5;
        const y = 0.5 - hit.y / WORLD_HEIGHT;

        if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
          uv = {x, y};
        }
      }
    }

    const pos = new THREE.Vector3();
    cameraObj.getWorldPosition(pos);
    const rot = cameraObj.rotation;

    window.SAGEIntegration.onHeadSample({
      nowMs: performance.now(),
      uv,
      // v10 simplified rule: 2 seconds continuously inside the ROI is enough.
      // Tiny headset velocity jitter is not allowed to block acquisition.
      angularVelocityDegPerSec: 0,
      measuredAngularVelocityDegPerSec: this.angularVelocity,
      headPose: {
        position: {x: pos.x, y: pos.y, z: pos.z},
        rotation: {x: rot.x, y: rot.y, z: rot.z}
      }
    });
  }
});
</script>

<script>
const infoPanel = document.querySelector('#infoPanel');
const welcomePanel = document.querySelector('#welcomePanel');
const gazeCursor = document.querySelector('#gazeCursor');

function setGazePointerInsideCue(isInside) {
  if (!gazeCursor) return;

  // Keep the reticle visible but subdued so it supports aiming without
  // becoming a dominant overlay on the artwork. Inside an active hotspot,
  // shift to a muted warm gold and slightly increase visibility.
  const color = isInside ? '#e3c56f' : '#d8d1c4';
  const opacity = isInside ? 0.52 : 0.32;

  gazeCursor.setAttribute('color', color);
  gazeCursor.setAttribute('material', 'color', color);
  gazeCursor.setAttribute('material', 'opacity', opacity);
}

const languageOverlay = document.querySelector('#languageOverlay');
const cueLayer = document.querySelector('#cueLayer');
const focusLayer = document.querySelector('#focusLayer');
const paintingBlur = document.querySelector('#paintingBlur');
const paintingRoot = document.querySelector('#paintingRoot');
const mainCamera = document.querySelector('#mainCamera');
const cameraRig = document.querySelector('#cameraRig');
const backButton = document.querySelector('#backButton');

const IMAGE_WIDTH = 15354;
const IMAGE_HEIGHT = 13230;
const WORLD_WIDTH = 4;
const WORLD_HEIGHT = 3.45;
const TILE_SIZE = 254;
const TILE_OVERLAP = 1;
const TILE_FOLDER = 'tiles';
const MAX_LEVEL = 14;
const GAZE_MS = 2000;

const FIXED_POI_SEQUENCE = Object.freeze(FIXED_STOPS.map(stop => stop.poi));
let selectedProfile = 'general';

const StudyLogger = {
  participantId: 'P000',
  condition: 'fixed_sequence',
  profile: 'general',
  startedAtIso: null,
  startedAtMs: null,
  endedAtIso: null,
  events: [],
  viewSamples: [],
  lastSampleMs: 0,

  start(participantId, profile) {
    this.participantId = (participantId || 'P000').trim() || 'P000';
    this.profile = profile || 'general';
    this.startedAtIso = new Date().toISOString();
    this.startedAtMs = performance.now();
    this.endedAtIso = null;
    this.events = [];
    this.viewSamples = [];
    this.lastSampleMs = 0;

    this.logEvent('session_started', {
      fixed_sequence: [...FIXED_POI_SEQUENCE],
      fixed_stops: FIXED_STOPS.map(s => ({poi: s.poi, node_ids: [...s.nodeIds]})),
      logger_sampling_hz: 5
    });
  },

  nowMs() {
    return this.startedAtMs == null ? 0 : Math.round(performance.now() - this.startedAtMs);
  },

  logEvent(event, data = {}) {
    if (this.startedAtMs == null) return;
    this.events.push({
      t_ms: this.nowMs(),
      event,
      ...data
    });
  },

  sampleView({uv, headPose, angularVelocityDegPerSec, activeTarget, state}) {
    if (this.startedAtMs == null) return;

    const now = performance.now();
    if (now - this.lastSampleMs < 200) return; // 5 Hz: sufficient for paths/heatmaps, lighter in Quest VR
    this.lastSampleMs = now;

    // Store the raw viewing coordinates only. Which POI the sample falls inside
    // can be derived offline after the session, avoiding 24 shape tests per sample.
    this.viewSamples.push({
      t_ms: this.nowMs(),
      painting_x: uv ? Number(uv.x.toFixed(5)) : null,
      painting_y: uv ? Number(uv.y.toFixed(5)) : null,
      yaw_rad: headPose?.rotation?.y ?? null,
      pitch_rad: headPose?.rotation?.x ?? null,
      roll_rad: headPose?.rotation?.z ?? null,
      angular_velocity_deg_s: Number.isFinite(angularVelocityDegPerSec)
        ? Number(angularVelocityDegPerSec.toFixed(3))
        : null,
      active_target: activeTarget || null,
      state: state || null
    });
  },

  summarize() {
    const totalDurationS = this.startedAtMs == null
      ? 0
      : (performance.now() - this.startedAtMs) / 1000;

    const acquisitionEvents = this.events.filter(e => e.event === 'target_acquired');
    const acquisitions = acquisitionEvents
      .map(e => e.acquisition_ms)
      .filter(v => Number.isFinite(v));

    const meanAcq = acquisitions.length
      ? acquisitions.reduce((a, b) => a + b, 0) / acquisitions.length
      : null;

    const sorted = [...acquisitions].sort((a, b) => a - b);
    const medianAcq = sorted.length
      ? (sorted.length % 2
          ? sorted[(sorted.length - 1) / 2]
          : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2)
      : null;

    const narrStarted = this.events.filter(e => e.event === 'audio_start').length;
    const narrCompleted = this.events.filter(e =>
      e.event === 'audio_completion' || e.event === 'narration_completion_threshold'
    ).length;
    const cueTimeouts = this.events.filter(e => e.event === 'guidance_timeout').length;
    const poisVisited = new Set(
      this.events
        .filter(e => e.event === 'target_acquired' && e.poi)
        .map(e => e.poi)
    ).size;

    let totalHeadRotationDeg = 0;
    for (let i = 1; i < this.viewSamples.length; i++) {
      const a = this.viewSamples[i - 1];
      const b = this.viewSamples[i];
      if (
        Number.isFinite(a.yaw_rad) && Number.isFinite(b.yaw_rad) &&
        Number.isFinite(a.pitch_rad) && Number.isFinite(b.pitch_rad)
      ) {
        const dy = b.yaw_rad - a.yaw_rad;
        const dp = b.pitch_rad - a.pitch_rad;
        totalHeadRotationDeg += Math.sqrt(dy * dy + dp * dp) * 180 / Math.PI;
      }
    }

    return {
      pois_visited: poisVisited,
      narrations_started: narrStarted,
      narrations_completed: narrCompleted,
      cue_successes: acquisitionEvents.length,
      cue_timeouts: cueTimeouts,
      mean_acquisition_ms: meanAcq == null ? null : Math.round(meanAcq),
      median_acquisition_ms: medianAcq == null ? null : Math.round(medianAcq),
      total_head_rotation_deg: Number(totalHeadRotationDeg.toFixed(2)),
      total_duration_s: Number(totalDurationS.toFixed(2))
    };
  },

  exportJson() {
    if (this.startedAtMs == null) return;

    this.endedAtIso = new Date().toISOString();

    const payload = {
      participant_id: this.participantId,
      condition: this.condition,
      profile: this.profile,
      session_start: this.startedAtIso,
      session_end: this.endedAtIso,
      fixed_sequence: [...FIXED_POI_SEQUENCE],
      summary: this.summarize(),
      events: this.events,
      view_samples: this.viewSamples
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], {
      type: 'application/json'
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    a.href = url;
    a.download = `${this.participantId}_fixed_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
};

window.StudyLogger = StudyLogger;


class StrictInnerDwellController {
  constructor(options = {}) {
    this.options = {
      orientationMs: 2000,
      departureGraceMs: 400,
      maxAngularVelocityDegPerSec: 15,
      ...options
    };
    this.reset();
  }

  reset() {
    this.state = 'outside';
    this.poi = null;
    this.innerStartedAt = null;
    this.lastInnerAt = null;
  }

  update({nowMs, poi = null, insideOuter = false, insideInner = false, angularVelocityDegPerSec = 0}) {
    const events = [];
    const stable = angularVelocityDegPerSec <= this.options.maxAngularVelocityDegPerSec;

    if (!poi || !insideOuter) {
      if (
        this.lastInnerAt !== null &&
        nowMs - this.lastInnerAt <= this.options.departureGraceMs
      ) {
        return {state: this.state, events};
      }

      if (this.state !== 'outside') {
        events.push({
          type: 'dwell_cancelled',
          poi: this.poi,
          at: nowMs,
          fromState: this.state
        });
      }
      this.reset();
      return {state: this.state, events};
    }

    // Being only in the outer ROI never starts the 2-second lock timer.
    if (!insideInner || !stable) {
      if (
        this.innerStartedAt !== null &&
        this.lastInnerAt !== null &&
        nowMs - this.lastInnerAt > this.options.departureGraceMs
      ) {
        if (this.state !== 'outside') {
          events.push({
            type: 'dwell_cancelled',
            poi: this.poi,
            at: nowMs,
            fromState: this.state
          });
        }
        this.reset();
      }
      return {state: this.state, events};
    }

    this.lastInnerAt = nowMs;

    // Start timing ONLY when the user is actually inside the inner target.
    if (this.poi !== poi || this.innerStartedAt === null) {
      this.poi = poi;
      this.innerStartedAt = nowMs;
      this.state = 'candidate';
      events.push({type: 'roi_candidate', poi, at: nowMs});
      return {state: this.state, events};
    }

    if (
      this.state === 'candidate' &&
      nowMs - this.innerStartedAt >= this.options.orientationMs
    ) {
      this.state = 'oriented';
      events.push({type: 'orientation_confirmed', poi, at: nowMs});
    }

    return {state: this.state, events};
  }
}

const SAGEIntegration = {
  runtime: null,
  corpus: null,
  pois: null,
  visitorState: null,
  dwell: null,
  activeRecommendation: null,
  activeRecommendations: [],
  visitedFixedStopIndices: new Set(),
  log: [],
  ready: false,
  lastUv: null,
  lastHeadPose: null,
  angularVelocity: 0,
  lastHeadLogMs: 0,
  roiInside: {outer: false, inner: false},
  poiCooldownUntil: new Map(),
  poiNarrationCounts: new Map(),
  narrationProgress: new Map(),
  resumeCounts: new Map(),
  narrationDepartureStartedMs: null,
  guidanceTimer: null,
  restTimer: null,
  recommendationToken: 0,
  fixedPoiIndex: 0,
  sessionStartedAt: performance.now(),

  async init({profile = selectedProfile, forceNew = false} = {}) {
    const runtime = await window.MarcoRuntimeReady;
    this.runtime = runtime;

    const [corpusResponse, poiResponse] = await Promise.all([
      fetch('./corpus/nightwatch_nodes.json'),
      fetch('./integration/nightwatch_pois.json')
    ]);
    if (!corpusResponse.ok) throw new Error(`Corpus load failed: ${corpusResponse.status}`);
    if (!poiResponse.ok) throw new Error(`POI load failed: ${poiResponse.status}`);

    this.corpus = await corpusResponse.json();
    this.pois = await poiResponse.json();

    // Single source of truth for spatial registration.
    // Cue center, activation ROI, and zoom center are all derived from these POI shapes.
    const moveEllipse = (id, dx = 0, dy = 0, absolute = null) => {
      const shape = this.pois?.shapes?.[id];
      if (!shape || shape.type !== 'ellipse') return;
      if (absolute) {
        shape.cx = absolute.x;
        shape.cy = absolute.y;
      } else {
        shape.cx += dx;
        shape.cy += dy;
      }
      shape.confidence = 'provisional_visual_adjusted';
    };

    // Manual visual registration corrections.
    moveEllipse('captain',          0.047, -0.085); // up to face
    moveEllipse('lieutenant',       0.040, -0.070); // up to face
    moveEllipse('girl',             0.020,  0.000);
    moveEllipse('hand_shadow',      0,      0, {x: 0.535, y: 0.620}); // lower
    // Standard Bearer is a polygon in the source POI JSON, so moveEllipse() never
    // changed it. Replace that provisional polygon with one registered ellipse so
    // the cue, gaze ROI, and zoom all use the same corrected location.
    this.pois.shapes.standard = {
      type: 'ellipse',
      cx: 0.300,
      cy: 0.400,
      rx: 0.065,
      ry: 0.145,
      confidence: 'provisional_visual_adjusted'
    };
    moveEllipse('musketeer_left',  -0.040, -0.040); // left + up
    moveEllipse('musketeer_right',  0.000, -0.035);
    moveEllipse('musketeer_center', 0.055,  0.040); // a little further right
    moveEllipse('drummer',          0.035,  0.035); // right

    // Cartouche correction.
    if (this.pois?.shapes?.cartouche) {
      this.pois.shapes.cartouche.cx = 0.560;
      this.pois.shapes.cartouche.cy = 0.190;
      this.pois.shapes.cartouche.rx = 0.080;
      this.pois.shapes.cartouche.ry = 0.052;
      this.pois.shapes.cartouche.confidence = 'provisional_visual_adjusted';
    }

    const persisted = !forceNew ? this.loadPersistedState(profile) : null;
    this.visitorState = persisted
      ? runtime.hydrateVisitorState(persisted.visitorState)
      : runtime.createVisitorState(profile);

    if (persisted) {
      this.poiCooldownUntil = new Map(persisted.poiCooldownUntil || []);
      this.poiNarrationCounts = new Map(persisted.poiNarrationCounts || []);
      this.narrationProgress = new Map(persisted.narrationProgress || []);
      this.resumeCounts = new Map(persisted.resumeCounts || []);
      this.log = persisted.log || [];
      window.SAGE_EVENT_LOG = this.log;
    } else {
      this.poiCooldownUntil = new Map();
      this.poiNarrationCounts = new Map();
      this.narrationProgress = new Map();
      this.resumeCounts = new Map();
      this.log = [];
      window.SAGE_EVENT_LOG = this.log;
    }

    this.dwell = new StrictInnerDwellController({
      orientationMs: MARCO_CONFIG.orientationMs,
      departureGraceMs: MARCO_CONFIG.departureGraceMs,
      maxAngularVelocityDegPerSec: MARCO_CONFIG.maxAngularVelocityDegPerSec
    });

    if (forceNew) this.fixedPoiIndex = 0;

    this.ready = true;
    this.record('session_initialized', {
      profile,
      guidance_mode: selectedGuidanceMode,
      tour_condition: 'fixed_sequence',
      config: MARCO_CONFIG,
      weights: runtime.DEFAULT_WEIGHTS,
      resumed: !!persisted,
      poi_coordinate_note: this.pois.coordinate_system?.note || null
    });

    return this;
  },

  storageKey(profile = selectedProfile) {
    return `nightwatch-sage-fixed-v23:${profile}:${selectedGuidanceMode}`;
  },

  persist() {
    if (!this.runtime || !this.visitorState) return;
    const payload = {
      visitorState: this.runtime.serializeVisitorState(this.visitorState),
      poiCooldownUntil: [...this.poiCooldownUntil.entries()],
      poiNarrationCounts: [...this.poiNarrationCounts.entries()],
      narrationProgress: [...this.narrationProgress.entries()],
      resumeCounts: [...this.resumeCounts.entries()],
      log: this.log.slice(-5000)
    };
    localStorage.setItem(this.storageKey(), JSON.stringify(payload));
  },

  loadPersistedState(profile) {
    try {
      const raw = localStorage.getItem(this.storageKey(profile));
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      console.warn('[Persistence] ignored invalid state', error);
      return null;
    }
  },

  resetSession() {
    localStorage.removeItem(this.storageKey());
    location.reload();
  },

  record(type, data = {}) {
    const event = this.runtime && this.runtime.makeEvent
      ? this.runtime.makeEvent(type, {
          profile: selectedProfile,
          guidance_mode: selectedGuidanceMode,
          ...data
        })
      : {schema_version: '1.0', type, timestamp_ms: performance.now(), ...data};
    this.log.push(event);

    if (window.StudyLogger && StudyLogger.startedAtMs !== null) {
      const {
        schema_version,
        timestamp_ms,
        type,
        ...studyData
      } = event;
      StudyLogger.logEvent(type, studyData);
    }

    this.persist();
    console.log('[SAGE event]', event);
    return event;
  },

  exportLog() {
    const payload = {
      exported_at: new Date().toISOString(),
      profile: selectedProfile,
      guidance_mode: selectedGuidanceMode,
      config: MARCO_CONFIG,
      weights: this.runtime?.DEFAULT_WEIGHTS || null,
      visitor_state: this.runtime && this.visitorState
        ? this.runtime.serializeVisitorState(this.visitorState)
        : null,
      events: this.log
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `nightwatch_sage_log_${selectedProfile}_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },

  shapeBounds(shape) {
    if (!shape) return null;
    if (shape.type === 'rect') {
      return {x0: shape.x, y0: shape.y, x1: shape.x + shape.width, y1: shape.y + shape.height};
    }
    if (shape.type === 'ellipse') {
      return {x0: shape.cx - shape.rx, y0: shape.cy - shape.ry, x1: shape.cx + shape.rx, y1: shape.cy + shape.ry};
    }
    if (shape.type === 'polygon') {
      const xs = shape.points.map(p => p[0]);
      const ys = shape.points.map(p => p[1]);
      return {x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys)};
    }
    return null;
  },

  shapeCenter(shape) {
    const b = this.shapeBounds(shape);
    return b ? {x: (b.x0 + b.x1) / 2, y: (b.y0 + b.y1) / 2} : null;
  },

  activationShapeForPoi(poiId) {
    const source = this.pois?.shapes?.[poiId];
    const bounds = this.shapeBounds(source);
    const center = this.shapeCenter(source);
    if (!bounds || !center) return source || null;

    // EXACT same center as the visible cue. The cue is 0.38 world units.
    // Convert that footprint back into painting-normalized coordinates.
    return {
      type: 'ellipse',
      cx: center.x,
      cy: center.y,
      rx: (0.38 / WORLD_WIDTH) / 2,
      ry: (0.38 / WORLD_HEIGHT) / 2
    };
  },

  shrinkBounds(bounds, scale) {
    const cx = (bounds.x0 + bounds.x1) / 2;
    const cy = (bounds.y0 + bounds.y1) / 2;

    // Guidance should be a compact illuminated patch, not the entire character
    // or a visibly huge Deep-Zoom block. The ROI used for activation remains
    // Marco's full shape; only the visual cue is capped to this smaller patch.
    const targetW = THREE.MathUtils.clamp(
      (bounds.x1 - bounds.x0) * scale,
      MARCO_CONFIG.cueMinWidthNorm,
      MARCO_CONFIG.cueMaxWidthNorm
    );
    const targetH = THREE.MathUtils.clamp(
      (bounds.y1 - bounds.y0) * scale,
      MARCO_CONFIG.cueMinHeightNorm,
      MARCO_CONFIG.cueMaxHeightNorm
    );
    const hw = targetW / 2;
    const hh = targetH / 2;

    return {
      x0: THREE.MathUtils.clamp(cx - hw, 0, 1),
      y0: THREE.MathUtils.clamp(cy - hh, 0, 1),
      x1: THREE.MathUtils.clamp(cx + hw, 0, 1),
      y1: THREE.MathUtils.clamp(cy + hh, 0, 1)
    };
  },

  expandShape(shape, amount = MARCO_CONFIG.outerRoiExpansion) {
    if (!shape) return null;
    if (shape.type === 'ellipse') {
      return {...shape, rx: Math.min(0.5, shape.rx * (1 + amount)), ry: Math.min(0.5, shape.ry * (1 + amount))};
    }
    if (shape.type === 'rect') {
      const dx = shape.width * amount / 2;
      const dy = shape.height * amount / 2;
      return {
        ...shape,
        x: Math.max(0, shape.x - dx),
        y: Math.max(0, shape.y - dy),
        width: Math.min(1, shape.width + 2 * dx),
        height: Math.min(1, shape.height + 2 * dy)
      };
    }
    if (shape.type === 'polygon') {
      const c = this.shapeCenter(shape);
      return {
        ...shape,
        points: shape.points.map(([x, y]) => [
          THREE.MathUtils.clamp(c.x + (x - c.x) * (1 + amount), 0, 1),
          THREE.MathUtils.clamp(c.y + (y - c.y) * (1 + amount), 0, 1)
        ])
      };
    }
    return shape;
  },

  confidenceGuideable(shape) {
    if (!shape) return false;
    const confidence = shape.confidence || '';
    if (confidence === 'registered_semantic') return true;
    if (confidence === 'provisional_visual') return MARCO_CONFIG.allowProvisionalVisual;
    if (confidence === 'requires_conservation_registration') return MARCO_CONFIG.allowConservationRegistrationPois;
    if (confidence.startsWith('conceptual')) return MARCO_CONFIG.allowConceptualPois;
    return false;
  },

  normalizedToWorld(x, y) {
    const local = new THREE.Vector3(
      (x - 0.5) * WORLD_WIDTH,
      (0.5 - y) * WORLD_HEIGHT,
      0
    );
    paintingRoot.object3D.localToWorld(local);
    return local;
  },

  angularMetrics(poiId) {
    const shape = this.pois?.shapes?.[poiId];
    const bounds = this.shapeBounds(shape);
    const center = this.shapeCenter(shape);
    if (!shape || !bounds || !center || !mainCamera) {
      return {eccentricity: 180, angularSize: 0, visibility: 0, convenience: 0};
    }

    const targetWorld = this.normalizedToWorld(center.x, center.y);
    const cameraPos = new THREE.Vector3();
    const cameraQuat = new THREE.Quaternion();
    mainCamera.object3D.getWorldPosition(cameraPos);
    mainCamera.object3D.getWorldQuaternion(cameraQuat);

    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(cameraQuat).normalize();
    const toTarget = targetWorld.clone().sub(cameraPos);
    const distance = Math.max(0.001, toTarget.length());
    toTarget.normalize();

    const eccentricity = THREE.MathUtils.radToDeg(
      Math.acos(THREE.MathUtils.clamp(forward.dot(toTarget), -1, 1))
    );

    const worldW = (bounds.x1 - bounds.x0) * WORLD_WIDTH * paintingRoot.object3D.scale.x;
    const worldH = (bounds.y1 - bounds.y0) * WORLD_HEIGHT * paintingRoot.object3D.scale.y;
    const characteristic = Math.max(worldW, worldH);
    const angularSize = THREE.MathUtils.radToDeg(2 * Math.atan2(characteristic / 2, distance));

    const visibility = eccentricity <= 28 ? 1 : eccentricity <= 45 ? 0.65 : eccentricity <= MARCO_CONFIG.guideableAngleDeg ? 0.30 : 0;
    const convenience = THREE.MathUtils.clamp(1 - eccentricity / MARCO_CONFIG.guideableAngleDeg, 0, 1);

    return {eccentricity, angularSize, visibility, convenience};
  },

  currentIntersectedPoi(poiId) {
    const shape = this.pois?.shapes?.[poiId];
    return !!(shape && this.lastUv && this.runtime.pointInShape(this.lastUv.x, this.lastUv.y, shape));
  },

  poiInCooldown(poiId, nowMs = performance.now()) {
    return (this.poiCooldownUntil.get(poiId) || 0) > Date.now();
  },

  nodeCountReached(poiId) {
    return (this.poiNarrationCounts.get(poiId) || 0) >= MARCO_CONFIG.maxNarrationsPerPoi;
  },

  buildSpatialState() {
    const spatial = {};
    const shapes = this.pois?.shapes || {};
    const now = performance.now();

    Object.entries(shapes).forEach(([poiId, shape]) => {
      const m = this.angularMetrics(poiId);
      const semanticallyUseful =
        !['whole', 'canvas'].includes(poiId) &&
        shape.confidence !== 'conceptual_missing_area';

      // IMPORTANT: do not make current head direction a hard eligibility gate.
      // SAGE is specifically meant to guide the visitor toward a target that may
      // not already be close to the current view. Eccentricity still affects the
      // recommendation SCORE through visibility/spatialConvenience, but it can no
      // longer eliminate every POI and leave the painting completely static.
      const guideable =
        semanticallyUseful &&
        this.confidenceGuideable(shape) &&
        !this.nodeCountReached(poiId);

      spatial[poiId] = {
        zoomValid: guideable,
        angularSizeValid: m.angularSize >= MARCO_CONFIG.minimumAngularSizeDeg,
        currentlyIntersected: this.currentIntersectedPoi(poiId),
        inCooldown: this.poiInCooldown(poiId, now),
        guideable,
        currentVisibility: m.visibility,
        spatialConvenience: m.convenience,
        targetEccentricityDeg: m.eccentricity,
        angularSizeDeg: m.angularSize,
        confidence: shape.confidence
      };
    });

    return spatial;
  },

  historyRelevance(node) {
    const recent = this.visitorState?.recentNodes || [];
    if (!recent.length) return 0.25;

    const recentNodes = recent
      .map(id => this.corpus.nodes.find(n => n.id === id))
      .filter(Boolean);

    const latest = recentNodes[0];
    if (!latest) return 0.25;

    const direct =
      (latest.unlocks || []).includes(node.id) ||
      (node.requires_all || []).includes(latest.id) ||
      (node.requires_any || []).includes(latest.id);
    if (direct) return 1.0;

    const anyLinked = recentNodes.some(r =>
      (r.unlocks || []).includes(node.id) ||
      (node.requires_all || []).includes(r.id) ||
      (node.requires_any || []).includes(r.id)
    );
    if (anyLinked) return 0.75;
    if (latest.category === node.category) return 0.45;
    return 0.20;
  },

  guidanceFatigue(nowMs = performance.now()) {
    const lastSec = this.visitorState?.lastGuidanceTime;
    if (!Number.isFinite(lastSec)) return 0;
    const elapsed = Date.now() / 1000 - lastSec;
    return THREE.MathUtils.clamp(1 - elapsed / 30, 0, 1);
  },

  featureProvider(node, poiSpatial) {
    return {
      historyRelevance: this.historyRelevance(node),
      currentVisibility: poiSpatial.currentVisibility ?? 0,
      spatialConvenience: poiSpatial.spatialConvenience ?? 0,
      guidanceFatigue: this.guidanceFatigue()
    };
  },

  async recommendNext() {
    if (!this.ready) await this.init();
    if (this.activeRecommendation || !['IDLE', 'FREE'].includes(TourEngine.state)) return null;

    const available = FIXED_STOPS
      .map((stop, index) => ({stop, index}))
      .filter(item => !this.visitedFixedStopIndices.has(item.index))
      .slice(0, 3);

    if (!available.length) {
      setSageStatus('Guided tour complete');
      this.record('fixed_tour_complete', {sequence_length: FIXED_STOPS.length});
      TourEngine.finishTour();
      return null;
    }

    const recommendations = available.map(({stop, index}) => {
      const nodes = stop.nodeIds
        .map(id => this.corpus.nodes.find(node => node.id === id))
        .filter(Boolean);
      if (!nodes.length) return null;
      const metrics = this.angularMetrics(stop.poi);
      return {
        node: nodes[0], nodes, poi: stop.poi, fixedStopIndex: index,
        score: null, contributions: null, features: null,
        onsetMs: performance.now(),
        eccentricityDeg: metrics?.eccentricity ?? null,
        angularSizeDeg: metrics?.angularSize ?? null
      };
    }).filter(Boolean);

    if (!recommendations.length) return null;

    this.activeRecommendations = recommendations;
    // No target is selected yet. activeRecommendation becomes the user's chosen target on gaze entry.
    this.activeRecommendation = recommendations[0];
    this.visitorState.activeNode = null;
    this.visitorState.lastGuidanceTime = performance.now() / 1000;
    this.visitorState.narrationState = 'idle';
    this.dwell.reset();
    this.roiInside = {outer: false, inner: false};

    const poiIds = recommendations.map(r => r.poi);
    setSageStatus(`Choose one of the ${poiIds.length} illuminated regions`);
    this.record('three_choice_offered', {
      poi_ids: poiIds,
      stop_indices: recommendations.map(r => r.fixedStopIndex)
    });

    await TourEngine.startCueChoices(poiIds);

    clearTimeout(this.guidanceTimer);
    this.guidanceTimer = setTimeout(() => this.guidanceTimeout(), MARCO_CONFIG.guidanceTimeoutMs);
    this.persist();
    return recommendations;
  },

  guidanceTimeout() {
    const rec = this.activeRecommendation;
    if (!rec || !['CUE', 'WAIT_GAZE'].includes(TourEngine.state)) return;

    QuestCue.hideAll();
    this.visitorState.dismissed.add(rec.node.id);
    this.startPoiCooldown(rec.poi, 'guidance_timeout');

    this.record('guidance_timeout', {
      node_id: rec.node.id,
      poi: rec.poi,
      elapsed_ms: performance.now() - rec.onsetMs
    });
    this.record('dismissal', {node_id: rec.node.id, poi: rec.poi, reason: 'timeout'});

    this.activeRecommendation = null;
    this.activeRecommendations = [];
    this.visitorState.activeNode = null;
    this.visitorState.narrationState = 'idle';
    this.dwell.reset();
    TourEngine.setState(State.FREE);
    this.startGlobalRest('guidance_timeout');
  },

  onHeadSample({nowMs, uv, angularVelocityDegPerSec, measuredAngularVelocityDegPerSec = angularVelocityDegPerSec, headPose}) {
    if (!this.ready) return;
    this.lastUv = uv;
    this.angularVelocity = measuredAngularVelocityDegPerSec;
    this.lastHeadPose = headPose;

    if (window.StudyLogger) {
      StudyLogger.sampleView({
        uv,
        headPose,
        angularVelocityDegPerSec: measuredAngularVelocityDegPerSec,
        activeTarget: this.activeRecommendations?.map(r => r.poi) || (this.activeRecommendation?.poi ? [this.activeRecommendation.poi] : []),
        state: TourEngine.state
      });
    }

    if (nowMs - this.lastHeadLogMs >= 250 && ['CUE', 'WAIT_GAZE', 'STORY'].includes(TourEngine.state)) {
      this.lastHeadLogMs = nowMs;
      this.record('head_pose_sample', {
        head_pose: headPose,
        angular_velocity_deg_s: measuredAngularVelocityDegPerSec,
        painting_uv: uv,
        zoom_scale: paintingRoot?.object3D?.scale?.x ?? 1
      });
    }

    if (this.activeRecommendation && ['CUE', 'WAIT_GAZE'].includes(TourEngine.state)) {
      this.updateDwell(nowMs, uv, angularVelocityDegPerSec);
    }

    if (this.activeRecommendation && TourEngine.state === 'STORY') {
      this.monitorNarrationDeparture(nowMs, uv);
    }
  },

  updateDwell(nowMs, uv, angularVelocityDegPerSec) {
    const choices = this.activeRecommendations?.length
      ? this.activeRecommendations
      : (this.activeRecommendation ? [this.activeRecommendation] : []);
    if (!choices.length) return;

    let rec = null;
    let shape = null;
    let outer = null;

    // If a dwell is already underway, keep evaluating that same target.
    const dwellPoi = this.dwell?.poi || this.dwell?.poiId || null;
    if (dwellPoi) rec = choices.find(r => r.poi === dwellPoi) || null;

    // Otherwise whichever of the three inner ROIs the user enters becomes the candidate.
    if (!rec && uv) {
      for (const candidate of choices) {
        const candidateShape = this.activationShapeForPoi(candidate.poi);
        if (candidateShape && this.runtime.pointInShape(uv.x, uv.y, candidateShape)) {
          rec = candidate;
          break;
        }
      }
    }

    // If not inside an inner ROI, use the currently active choice only for exit/reset handling.
    if (!rec) rec = this.activeRecommendation;
    if (!rec) return;

    shape = this.activationShapeForPoi(rec.poi);
    if (!shape) return;
    outer = this.expandShape(shape);

    const insideInner = !!(uv && this.runtime.pointInShape(uv.x, uv.y, shape));
    const insideOuter = !!(uv && this.runtime.pointInShape(uv.x, uv.y, outer));
    setGazePointerInsideCue(insideInner);

    // As soon as gaze enters one of the three exact target ROIs, make it the active choice.
    if (insideInner && this.activeRecommendation?.poi !== rec.poi) {
      this.activeRecommendation = rec;
      this.visitorState.activeNode = rec.node.id;
      this.dwell.reset();
      this.roiInside = {outer: false, inner: false};
      this.record('choice_target_entered', {node_id: rec.node.id, poi: rec.poi});
    }

    if (insideOuter !== this.roiInside.outer) {
      this.record(insideOuter ? 'roi_outer_enter' : 'roi_outer_exit', {
        node_id: rec.node.id, poi: rec.poi, painting_uv: uv
      });
      this.roiInside.outer = insideOuter;
    }
    if (insideInner !== this.roiInside.inner) {
      this.record(insideInner ? 'roi_inner_enter' : 'roi_inner_exit', {
        node_id: rec.node.id, poi: rec.poi, painting_uv: uv
      });
      setSageStatus(insideInner
        ? `Selected ${rec.poi}: hold for 2 seconds…`
        : 'Choose one of the illuminated regions');
      this.roiInside.inner = insideInner;
    }

    const result = this.dwell.update({
      nowMs, poi: rec.poi, insideOuter, insideInner, angularVelocityDegPerSec
    });

    result.events.forEach(event => {
      this.record(event.type, {
        node_id: rec.node.id, poi: rec.poi, controller_at_ms: event.at,
        from_state: event.fromState || null,
        angular_velocity_deg_s: angularVelocityDegPerSec
      });

      if (event.type === 'orientation_confirmed') {
        const acquisitionMs = nowMs - rec.onsetMs;
        setSageStatus(`Target acquired: ${rec.poi} — zooming`);
        this.record('three_choice_selected', {
          node_id: rec.node.id, poi: rec.poi,
          offered_pois: choices.map(r => r.poi),
          acquisition_ms: acquisitionMs
        });
        clearTimeout(this.guidanceTimer);
        QuestCue.hideAll();
        this.activeRecommendation = rec;
        this.activeRecommendations = [];
        this.visitorState.activeNode = rec.node.id;
        this.visitorState.started.add(rec.node.id);
        this.visitorState.narrationState = 'playing';
        this.dwell.reset();
        TourEngine.openRecommendedTarget(rec.poi, rec.node);
        return;
      }

      if (event.type === 'dwell_cancelled') {
        this.visitorState.narrationState = 'idle';
        this.record('orientation_cancelled', {
          node_id: rec.node.id, poi: rec.poi, from_state: event.fromState || null
        });
      }
    });
  },

  startPoiCooldown(poi, reason = 'narration') {
    const until = Date.now() + MARCO_CONFIG.samePoiCooldownMs;
    this.poiCooldownUntil.set(poi, until);
    this.record('cooldown_started', {poi, reason, until_ms: until});

    setTimeout(() => {
      if ((this.poiCooldownUntil.get(poi) || 0) <= Date.now()) {
        this.record('cooldown_ended', {poi, reason});
      }
    }, MARCO_CONFIG.samePoiCooldownMs + 20);
  },

  startGlobalRest(reason = 'narration') {
    clearTimeout(this.restTimer);
    this.record('global_guidance_rest_started', {
      reason,
      duration_ms: MARCO_CONFIG.globalGuidanceRestMs
    });

    this.restTimer = setTimeout(() => {
      this.record('global_guidance_rest_ended', {reason});
      if (TourEngine.state === State.FREE || TourEngine.state === State.IDLE) {
        TourEngine.recommendAndCue().catch(console.error);
      }
    }, MARCO_CONFIG.globalGuidanceRestMs);
  },

  eligibleIdsNow() {
    const spatial = this.buildSpatialState();
    const copy = {...this.visitorState, activeNode: null, narrationState: 'idle'};
    try {
      // Use selection result to expose exactly what runtime eligibility sees.
      return new Set(this.runtime.selectRecommendation(
        this.corpus.nodes,
        copy,
        spatial,
        (node, poiSpatial) => this.featureProvider(node, poiSpatial)
      ).candidates.map(c => c.node.id));
    } catch {
      return new Set();
    }
  },

  markCompletionThreshold(node) {
    if (this.visitorState.completed.has(node.id)) return;
    const before = this.eligibleIdsNow();
    this.runtime.markNarrationCompleted(this.visitorState, node, performance.now() / 1000);
    const after = this.eligibleIdsNow();
    const newlyEligible = [...after].filter(id => !before.has(id));

    const count = (this.poiNarrationCounts.get(node.poi) || 0) + 1;
    this.poiNarrationCounts.set(node.poi, count);

    this.record('narration_completion_threshold', {
      node_id: node.id,
      poi: node.poi,
      fraction: MARCO_CONFIG.narrationCompletionFraction,
      poi_narration_count: count
    });

    if (newlyEligible.length) {
      this.record('prerequisite_state_changed', {
        completed_node_id: node.id,
        newly_eligible_node_ids: newlyEligible
      });
    }

    this.persist();
  },

  monitorNarrationDeparture(nowMs, uv) {
    const rec = this.activeRecommendation;
    if (!rec || !NarrationManager.isPlaying()) return;

    const shape = this.pois?.shapes?.[rec.poi];
    const outer = this.expandShape(shape);
    const insideOuter = !!(uv && outer && this.runtime.pointInShape(uv.x, uv.y, outer));

    if (insideOuter) {
      this.narrationDepartureStartedMs = null;
      return;
    }

    if (this.narrationDepartureStartedMs === null) {
      this.narrationDepartureStartedMs = nowMs;
      return;
    }

    if (nowMs - this.narrationDepartureStartedMs >= MARCO_CONFIG.sustainedNarrationDepartureMs) {
      this.narrationDepartureStartedMs = null;
      NarrationManager.interruptForDeparture();
    }
  },

  finishNarration(node, {interrupted = false, ended = false} = {}) {
    const rec = this.activeRecommendation;

    if (!interrupted && ended && !this.visitorState.completed.has(node.id)) {
      this.markCompletionThreshold(node);
    }

    const spatialPoi = rec?.poi || node.poi;
    this.startPoiCooldown(spatialPoi, interrupted ? 'narration_interrupted' : 'narration_completed');

    this.record(interrupted ? 'narration_interrupted' : 'narration_finished', {
      node_id: node.id,
      poi: node.poi,
      completed: this.visitorState.completed.has(node.id)
    });

    this.activeRecommendation = null;
    this.visitorState.activeNode = null;
    this.visitorState.narrationState = interrupted ? 'paused' : 'idle';

    // Mark only the user's chosen stop as visited. The other offered POIs remain available.
    if (!interrupted && Number.isInteger(rec?.fixedStopIndex)) {
      this.visitedFixedStopIndices.add(rec.fixedStopIndex);
      this.record('choice_stop_visited', {
        visited_stop_index: rec.fixedStopIndex,
        visited_poi: rec.poi,
        visited_count: this.visitedFixedStopIndices.size
      });
    }
    this.activeRecommendations = [];

    this.dwell.reset();
    this.persist();

    TourEngine.returnFromTarget(false, () => this.startGlobalRest(interrupted ? 'interruption' : 'narration'));
  },

  narrationText(node) {
    const variant = node.texts?.[selectedProfile] || node.texts?.general;
    return variant?.text || '';
  }
};

window.SAGEIntegration = SAGEIntegration;
window.SAGE_EVENT_LOG = SAGEIntegration.log;

const REGION = {
  captain:        { cueW: 0.52, cueH: 0.78, cueOffsetX: 0.00, cueOffsetY: 0.02, focusW: 0.56, focusH: 0.90 },
  lieutenant:     { cueW: 0.44, cueH: 0.72, cueOffsetX: 0.00, cueOffsetY: 0.00, focusW: 0.54, focusH: 0.90 },
  girl:           { cueW: 0.40, cueH: 0.60, cueOffsetX: 0.00, cueOffsetY: 0.00, focusW: 0.46, focusH: 0.70 },
  drummer:        { cueW: 0.54, cueH: 0.84, cueOffsetX: 0.00, cueOffsetY: 0.05, focusW: 0.66, focusH: 0.98 },
  flag:           { cueW: 0.48, cueH: 0.82, cueOffsetX: 0.00, cueOffsetY: 0.02, focusW: 0.70, focusH: 1.08 },
  musketeer:      { cueW: 0.40, cueH: 0.62, cueOffsetX: 0.00, cueOffsetY: 0.00, focusW: 0.48, focusH: 0.78 },
  dog:            { cueW: 0.44, cueH: 0.28, cueOffsetX: 0.00, cueOffsetY: 0.00, focusW: 0.66, focusH: 0.40 },
  leftGroup:      { cueW: 0.64, cueH: 0.78, cueOffsetX: 0.00, cueOffsetY: 0.00, focusW: 0.74, focusH: 0.96 },
  rightGroup:     { cueW: 0.72, cueH: 0.82, cueOffsetX: 0.00, cueOffsetY: 0.00, focusW: 0.86, focusH: 1.02 },
  backgroundArch: { cueW: 0.72, cueH: 0.38, cueOffsetX: 0.00, cueOffsetY: 0.00, focusW: 0.96, focusH: 0.68 }
};

const State = Object.freeze({
  IDLE: 'IDLE',
  CUE: 'CUE',
  WAIT_GAZE: 'WAIT_GAZE',

function levelDimensions(level) {
  const scale = Math.pow(2, level - MAX_LEVEL);
  return {
    width: Math.ceil(IMAGE_WIDTH * scale),
    height: Math.ceil(IMAGE_HEIGHT * scale)
  };
}

function tileGeometry(level, col, row) {
  const dims = levelDimensions(level);
  const coreX = col * TILE_SIZE;
  const coreY = row * TILE_SIZE;

  if (coreX >= dims.width || coreY >= dims.height) return null;

  const columns = Math.ceil(dims.width / TILE_SIZE);
  const rows = Math.ceil(dims.height / TILE_SIZE);

  const leftOverlap = col === 0 ? 0 : TILE_OVERLAP;
  const topOverlap = row === 0 ? 0 : TILE_OVERLAP;
  const rightOverlap = col === columns - 1 ? 0 : TILE_OVERLAP;
  const bottomOverlap = row === rows - 1 ? 0 : TILE_OVERLAP;

  const fileX = Math.max(0, coreX - leftOverlap);
  const fileY = Math.max(0, coreY - topOverlap);
  const fileW = Math.min(
    TILE_SIZE + leftOverlap + rightOverlap,
    dims.width - fileX
  );
  const fileH = Math.min(
    TILE_SIZE + topOverlap + bottomOverlap,
    dims.height - fileY
  );

  return {
    dims,
    fileX,
    fileY,
    fileW,
    fileH,
    worldW: fileW / dims.width * WORLD_WIDTH,
    worldH: fileH / dims.height * WORLD_HEIGHT,
    centerX: ((fileX + fileW / 2) / dims.width - 0.5) * WORLD_WIDTH,
    centerY: (0.5 - (fileY + fileH / 2) / dims.height) * WORLD_HEIGHT
  };
}

function hotspotCenter(id) {
  const hotspot = document.querySelector('#' + id);
  const pos = hotspot.getAttribute('position');
  return { x: pos.x, y: pos.y - 1.6 };
}

function tileRangeFor(id, width, height, offsetX = 0, offsetY = 0) {
  const baseCenter = hotspotCenter(id);
  const center = {
    x: baseCenter.x + offsetX,
    y: baseCenter.y + offsetY
  };
  const dims = levelDimensions(MAX_LEVEL);

  const leftPx = Math.max(
    0,
    ((center.x - width / 2) / WORLD_WIDTH + 0.5) * dims.width
  );
  const rightPx = Math.min(
    dims.width,
    ((center.x + width / 2) / WORLD_WIDTH + 0.5) * dims.width
  );
  const topPx = Math.max(
    0,
    (0.5 - (center.y + height / 2) / WORLD_HEIGHT) * dims.height
  );
  const bottomPx = Math.min(
    dims.height,
    (0.5 - (center.y - height / 2) / WORLD_HEIGHT) * dims.height
  );

  return {
    center,
    startCol: Math.floor(leftPx / TILE_SIZE),
    endCol: Math.floor(Math.max(0, rightPx - 1) / TILE_SIZE),
    startRow: Math.floor(topPx / TILE_SIZE),
    endRow: Math.floor(Math.max(0, bottomPx - 1) / TILE_SIZE)
  };
}

function animateOpacity(object3D, target, duration = 450) {
  if (!object3D) return;

  const materials = [];
  object3D.traverse(node => {
    if (node.material) materials.push(node.material);
  });

  const startValues = materials.map(material => material.opacity || 0);
  const started = performance.now();

  function frame(now) {
    const progress = Math.min(1, (now - started) / duration);
    const eased = progress * progress * (3 - 2 * progress);

    materials.forEach((material, index) => {
      material.transparent = true;
      material.opacity =
        startValues[index] +
        (target - startValues[index]) * eased;
      material.needsUpdate = true;
    });

    if (progress < 1) requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

function animateTint(object3D, targetHex, duration = 850) {
  return new Promise(resolve => {
    if (!object3D) {
      resolve();
      return;
    }

    const materials = [];
    object3D.traverse(node => {
      if (node.material && node.material.color) {
        materials.push(node.material);
      }
    });

    if (!materials.length) {
      resolve();
      return;
    }

    const target = new THREE.Color(targetHex);
    const starts = materials.map(material => material.color.clone());
    const started = performance.now();

    function frame(now) {
      const progress = Math.min(1, (now - started) / duration);
      const eased =
        progress < 0.5
          ? 2 * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 2) / 2;

      materials.forEach((material, index) => {
        material.color.copy(starts[index]).lerp(target, eased);
        material.needsUpdate = true;
      });

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        resolve();
      }
    }

    requestAnimationFrame(frame);
  });
}

function setBlurOpacity(target, duration = 450) {
  const mesh = paintingBlur.getObject3D('mesh');
  if (!mesh || !mesh.material) return;

  const start = mesh.material.opacity || 0;
  const started = performance.now();

  function frame(now) {
    const progress = Math.min(1, (now - started) / duration);
    const eased = progress * progress * (3 - 2 * progress);

    mesh.material.opacity =
      start + (target - start) * eased;
    mesh.material.needsUpdate = true;

    if (progress < 1) requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

const QuestCue = {
  activePoi: null,
  group: null,
  groups: [],
  token: 0,
  rotationTimer: null,
  rotationIndex: 0,

  hideAll() {
    this.token += 1;
    this.activePoi = null;

    if (this.rotationTimer) {
      clearInterval(this.rotationTimer);
      this.rotationTimer = null;
    }

    for (const group of this.groups) {
      if (group) disposeEntityTree(group);
    }

    this.groups = [];
    this.group = null;
    this.rotationIndex = 0;
  },

  fadeOut(duration = 240) {
    // For the three-choice condition, remove all offered cues together
    // after the participant selects one.
    const groups = [...this.groups];
    if (!groups.length) return;

    if (this.rotationTimer) {
      clearInterval(this.rotationTimer);
      this.rotationTimer = null;
    }

    groups.forEach(group => {
      const plane = group.querySelector('a-plane');
      if (!plane) return;
      plane.removeAttribute('animation__halopulse');
      plane.setAttribute('animation__halofade', {
        property: 'material.opacity',
        to: 0,
        dur: duration,
        easing: 'easeOutQuad'
      });
    });

    setTimeout(() => this.hideAll(), duration + 30);
  },

  async show(poiId) {
    return this.showMany([poiId]);
  },

  async showMany(poiIds) {
    this.hideAll();

    const ids = [...new Set((poiIds || []).filter(Boolean))].slice(0, 3);
    if (selectedGuidanceMode === 'baseline' || !ids.length) return;

    const sessionToken = this.token;
    this.activePoi = ids;

    for (const id of ids) {
      await this.showOne(id, sessionToken);
    }

    // All three remain subtly visible, but ONLY ONE pulses at a time.
    // Attention rotates every 2 seconds: 1 -> 2 -> 3 -> 1 ...
    this.rotationIndex = 0;
    this.activateRotatingCue(this.rotationIndex);

    if (ids.length > 1) {
      this.rotationTimer = setInterval(() => {
        if (sessionToken !== this.token || !this.groups.length) return;
        this.rotationIndex = (this.rotationIndex + 1) % this.groups.length;
        this.activateRotatingCue(this.rotationIndex);
      }, 2000);
    }

    SAGEIntegration.record('three_choice_cues_rendered', {
      poi_ids: ids,
      cue_rotation_ms: 2000,
      simultaneous_pulses: 1
    });
  },

  activateRotatingCue(index) {
    this.groups.forEach((group, i) => {
      const plane = group.querySelector('a-plane');
      if (!plane) return;

      plane.removeAttribute('animation__halopulse');

      if (i === index) {
        // Active suggestion: slower, softer pulsing. The 2-second focus rotation is
        // unchanged, but each brighten/dim transition now takes 350 ms.
        plane.setAttribute('material', 'opacity', MARCO_CONFIG.cueOpacityMin);
        plane.setAttribute('animation__halopulse', {
          property: 'material.opacity',
          from: MARCO_CONFIG.cueOpacityMin,
          to: MARCO_CONFIG.cueOpacityMax,
          dur: MARCO_CONFIG.cuePulseMs,
          easing: 'easeInOutSine',
          dir: 'alternate',
          loop: true
        });
      } else {
        // Other two choices stay visible but quiet; they remain selectable.
        plane.setAttribute('material', 'opacity', 0.055);
      }
    });

    const activeGroup = this.groups[index];
    SAGEIntegration.record('cue_rotation_focus', {
      poi: activeGroup?.dataset?.poi || null,
      rotation_index: index,
      duration_ms: 2000
    });
  },

  async showOne(poiId, sessionToken) {
    if (selectedGuidanceMode === 'baseline') return;

    const shape = SAGEIntegration.pois?.shapes?.[poiId];
    const bounds = SAGEIntegration.shapeBounds(shape);
    const center = SAGEIntegration.shapeCenter(shape);
    if (!bounds || !center || sessionToken !== this.token) return;

    const group = document.createElement('a-entity');
    group.dataset.poi = poiId;
    cueLayer.appendChild(group);
    this.groups.push(group);
    this.group = group;

    const haloW = 0.38;
    const haloH = 0.38;

    const cueAnchor = cueAnchorForPoi(poiId, bounds, center);
    const centerX = (cueAnchor.x - 0.5) * WORLD_WIDTH;
    const centerY = (0.5 - cueAnchor.y) * WORLD_HEIGHT;

    const plane = document.createElement('a-plane');
    plane.setAttribute('width', haloW);
    plane.setAttribute('height', haloH);
    plane.setAttribute('position', `${centerX} ${centerY} 0.032`);
    plane.setAttribute('render-layer', 'layer: 1');
    plane.setAttribute('material', {
      shader: 'tile-glow',
      opacity: 0.055,
      transparent: true,
      depthTest: false,
      depthWrite: false,
      side: 'double'
    });

    group.appendChild(plane);

    plane.addEventListener('object3dset', () => {
      plane.object3D.traverse(object => object.layers.set(1));
    });

    SAGEIntegration.record('cue_rendered', {
      poi: poiId,
      cue_type: 'rotating_three_choice_halo',
      halo_width_world: haloW,
      halo_height_world: haloH,
      cue_anchor: cueAnchor,
      quiet_opacity: 0.055,
      pulse_opacity_min: MARCO_CONFIG.cueOpacityMin,
      pulse_opacity_max: MARCO_CONFIG.cueOpacityMax,
      pulse_transition_ms: MARCO_CONFIG.cuePulseMs
    });
  }
};

function disposeEntityTree(rootEl) {
  if (!rootEl) return;

  // Dispose GPU resources explicitly before removing DOM entities.
  try {
    const object3D = rootEl.object3D;
    if (object3D) {
      object3D.traverse(obj => {
        if (obj.geometry && typeof obj.geometry.dispose === 'function') {
          try { obj.geometry.dispose(); } catch {}
        }

        const materials = obj.material
          ? (Array.isArray(obj.material) ? obj.material : [obj.material])
          : [];

        materials.forEach(material => {
          if (!material) return;
          [
            'map', 'alphaMap', 'aoMap', 'bumpMap', 'displacementMap',
            'emissiveMap', 'envMap', 'lightMap', 'metalnessMap',
            'normalMap', 'roughnessMap'
          ].forEach(key => {
            const tex = material[key];
            if (tex && typeof tex.dispose === 'function') {
              try { tex.dispose(); } catch {}
            }
          });
          if (typeof material.dispose === 'function') {
            try { material.dispose(); } catch {}
          }
        });
      });
    }
  } catch {}

  // Remove A-Frame animation/material attributes to stop hidden update work.
  try {
    rootEl.querySelectorAll('*').forEach(el => {
      [...el.attributes].forEach(attr => {
        if (attr.name.startsWith('animation__')) el.removeAttribute(attr.name);
      });
      if (el.pause) {
        try { el.pause(); } catch {}
      }
    });
  } catch {}

  if (rootEl.parentNode) rootEl.parentNode.removeChild(rootEl);
}

function clearFocusTiles() {
  while (focusLayer.firstChild) {
    disposeEntityTree(focusLayer.firstChild);
  }
}
function preloadImage(url) {
  return new Promise(resolve => {
    const image = new Image();
    image.crossOrigin = 'anonymous';
    image.onload = () => resolve({ok:true,url});
    image.onerror = () => resolve({ok:false,url});
    image.src = url;
  });
}
async function loadFocusTiles(id) {
  clearFocusTiles();
  const cfg = REGION[id];
  const range = tileRangeFor(id, cfg.focusW, cfg.focusH);
  const tiles = [];
  for (let row = range.startRow; row <= range.endRow; row++) {
    for (let col = range.startCol; col <= range.endCol; col++) {
      const geometry = tileGeometry(MAX_LEVEL, col, row);
      if (geometry) tiles.push({col,row,geometry,url:`${TILE_FOLDER}/${MAX_LEVEL}/${col}_${row}.jpeg`});
    }
  }
  const results = await Promise.all(tiles.map(t => preloadImage(t.url)));
  const available = tiles.filter((t,i) => results[i].ok);
  const group = document.createElement('a-entity');
  group.dataset.target = id;
  focusLayer.appendChild(group);
  const promises = available.map(tile => new Promise(resolve => {
    const plane = document.createElement('a-image');
    plane.setAttribute('src', tile.url);
    plane.setAttribute('width', tile.geometry.worldW);
    plane.setAttribute('height', tile.geometry.worldH);
    plane.setAttribute('position', `${tile.geometry.centerX} ${tile.geometry.centerY} 0.018`);
    plane.setAttribute('material', 'shader: flat; transparent: true; opacity: 0; depthTest: false; depthWrite: false; side: double; toneMapped: false');
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(plane); } };
    plane.addEventListener('materialtextureloaded', finish, {once:true});
    plane.addEventListener('loaded', () => setTimeout(finish, 700), {once:true});
    group.appendChild(plane);
  }));
  const planes = await Promise.all(promises);
  planes.forEach((plane,index) => plane.setAttribute(`animation__focusfade${index}`, 'property: material.opacity; from: 0; to: 1; dur: 450; easing: easeOutQuad'));
  console.log(`[Focus tiles] ${id}: ${planes.length}/${tiles.length} loaded`);
}


function normalizedBoundsWithPadding(poiId, paddingFraction = 0.08) {
  const shape = SAGEIntegration.pois?.shapes?.[poiId];
  const b = SAGEIntegration.shapeBounds(shape);
  if (!b) return null;
  const w = b.x1 - b.x0;
  const h = b.y1 - b.y0;
  return {
    x0: THREE.MathUtils.clamp(b.x0 - w * paddingFraction, 0, 1),
    y0: THREE.MathUtils.clamp(b.y0 - h * paddingFraction, 0, 1),
    x1: THREE.MathUtils.clamp(b.x1 + w * paddingFraction, 0, 1),
    y1: THREE.MathUtils.clamp(b.y1 + h * paddingFraction, 0, 1)
  };
}

async function loadFocusTilesForPoi(poiId) {
  clearFocusTiles();
  const bounds = normalizedBoundsWithPadding(poiId, 0.08);
  if (!bounds) return;

  const leftPx = bounds.x0 * IMAGE_WIDTH;
  const rightPx = bounds.x1 * IMAGE_WIDTH;
  const topPx = bounds.y0 * IMAGE_HEIGHT;
  const bottomPx = bounds.y1 * IMAGE_HEIGHT;

  const startCol = Math.floor(leftPx / TILE_SIZE);
  const endCol = Math.floor(Math.max(0, rightPx - 1) / TILE_SIZE);
  const startRow = Math.floor(topPx / TILE_SIZE);
  const endRow = Math.floor(Math.max(0, bottomPx - 1) / TILE_SIZE);

  const tiles = [];
  for (let row = startRow; row <= endRow; row++) {
    for (let col = startCol; col <= endCol; col++) {
      const geometry = tileGeometry(MAX_LEVEL, col, row);
      if (geometry) {
        tiles.push({col, row, geometry, url: `${TILE_FOLDER}/${MAX_LEVEL}/${col}_${row}.jpeg`});
      }
    }
  }

  // Load each tile only once through the actual A-Frame image entity.
  // The previous preload pass caused duplicate image fetch/decode work in VR.
  const group = document.createElement('a-entity');
  group.dataset.poi = poiId;
  focusLayer.appendChild(group);

  const promises = tiles.map(tile => new Promise(resolve => {
    const plane = document.createElement('a-image');
    plane.setAttribute('src', tile.url);
    plane.setAttribute('width', tile.geometry.worldW);
    plane.setAttribute('height', tile.geometry.worldH);
    plane.setAttribute('position', `${tile.geometry.centerX} ${tile.geometry.centerY} 0.018`);
    plane.setAttribute('material', 'shader: flat; transparent: true; opacity: 0; depthTest: false; depthWrite: false; side: double; toneMapped: false');
    let done = false;
    const finish = (ok = true) => {
      if (!done) {
        done = true;
        resolve(ok ? plane : null);
      }
    };
    plane.addEventListener('materialtextureloaded', () => finish(true), {once:true});
    plane.addEventListener('error', () => finish(false), {once:true});
    plane.addEventListener('loaded', () => setTimeout(() => finish(true), 700), {once:true});
    group.appendChild(plane);
  }));

  const loadedPlanes = (await Promise.all(promises)).filter(Boolean);
  loadedPlanes.forEach((plane, index) =>
    plane.setAttribute(`animation__focusfade${index}`, 'property: material.opacity; from: 0; to: 1; dur: 350; easing: easeOutQuad')
  );

  SAGEIntegration.record('focus_tiles_loaded', {
    poi: poiId,
    loaded_count: loadedPlanes.length,
    requested_count: tiles.length
  });
}

function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = window.speechSynthesis.getVoices();
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
}

function stopSpeech() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  speechUtterance = null;
}

function speak(text, onEnd = null) {
  if (!('speechSynthesis' in window) || !text) return;

  stopSpeech();
  refreshVoices();

  const prefix = currentLanguage === 'ar' ? 'ar' : 'en';
  const preferred = voices.find(v =>
    v.lang.toLowerCase().startsWith(prefix) &&
    /aria|jenny|samantha|daniel|salma|hamed|google/i.test(v.name)
  ) || voices.find(v => v.lang.toLowerCase().startsWith(prefix));

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = currentLanguage === 'ar' ? 'ar-SA' : 'en-US';
  utterance.rate = currentLanguage === 'ar' ? 0.88 : 0.92;
  utterance.pitch = 0.97;
  if (preferred) utterance.voice = preferred;

  if (typeof onEnd === 'function') {
    let completed = false;
    const finish = () => {
      if (completed) return;
      completed = true;
      onEnd();
    };

    utterance.onend = finish;
    utterance.onerror = finish;
  }

  speechUtterance = utterance;
  window.speechSynthesis.speak(utterance);
}

const AUDIO_FILES = {
  intro: 'intro.mp3',
  captain: 'captain.mp3',
  lieutenant: 'lieutenant.mp3',
  girl: 'girl.mp3'
};

const narrator = new Audio();
narrator.preload = 'auto';

const NarrationManager = {
  node: null,
  completionRecorded: false,
  intentionallyStopping: false,
  onFinished: null,

  isPlaying() {
    return !!(this.node && !narrator.paused && !narrator.ended);
  },

  stop(reason = 'manual_stop') {
    if (!this.node) return;
    this.intentionallyStopping = true;
    const node = this.node;
    SAGEIntegration.record('audio_stop', {
      node_id: node.id,
      poi: node.poi,
      reason,
      current_time_s: narrator.currentTime || 0
    });
    narrator.pause();
    narrator.removeAttribute('src');
    narrator.load();
    this.node = null;
    this.completionRecorded = false;
    this.onFinished = null;
    this.intentionallyStopping = false;
  },

  playNode(node, onFinished = null) {
    this.stop('replace_audio');
    this.node = node;
    this.onFinished = onFinished;
    this.completionRecorded = SAGEIntegration.visitorState.completed.has(node.id);
    this.intentionallyStopping = false;

    const file = `audio/${selectedProfile}/${node.id}.mp3`;
    const saved = SAGEIntegration.narrationProgress.get(node.id);
    const resumeCount = SAGEIntegration.resumeCounts.get(node.id) || 0;

    narrator.src = file;
    narrator.volume = 1.0;

    narrator.onloadedmetadata = () => {
      if (saved?.currentTime && resumeCount <= 1 && saved.currentTime < narrator.duration * 0.9) {
        narrator.currentTime = saved.currentTime;
        SAGEIntegration.record('audio_resume', {
          node_id: node.id,
          poi: node.poi,
          resume_from_s: saved.currentTime,
          resume_count: resumeCount
        });
      } else {
        SAGEIntegration.record('audio_start', {
          node_id: node.id,
          poi: node.poi,
          duration_s: narrator.duration
        });
      }
    };

    narrator.ontimeupdate = () => {
      if (!this.node || !Number.isFinite(narrator.duration) || narrator.duration <= 0) return;
      const fraction = narrator.currentTime / narrator.duration;

      SAGEIntegration.narrationProgress.set(node.id, {
        currentTime: narrator.currentTime,
        duration: narrator.duration,
        fraction
      });

      if (!this.completionRecorded && fraction >= MARCO_CONFIG.narrationCompletionFraction) {
        this.completionRecorded = true;
        SAGEIntegration.markCompletionThreshold(node);
      }
    };

    narrator.onpause = () => {
      if (!this.node || this.intentionallyStopping || narrator.ended) return;
      SAGEIntegration.record('audio_pause', {
        node_id: node.id,
        poi: node.poi,
        current_time_s: narrator.currentTime || 0
      });
    };

    narrator.onended = () => {
      if (!this.node) return;
      if (!this.completionRecorded) {
        this.completionRecorded = true;
        SAGEIntegration.markCompletionThreshold(node);
      }

      SAGEIntegration.record('audio_completion', {
        node_id: node.id,
        poi: node.poi,
        listened_fraction: 1.0
      });

      const callback = this.onFinished;
      this.node = null;
      this.onFinished = null;
      if (typeof callback === 'function') callback({interrupted: false, ended: true});
    };

    narrator.onerror = () => {
      SAGEIntegration.record('audio_error', {node_id: node.id, poi: node.poi, file});
      const text = SAGEIntegration.narrationText(node);
      speak(text, () => {
        if (!this.completionRecorded) {
          this.completionRecorded = true;
          SAGEIntegration.markCompletionThreshold(node);
        }
        const callback = this.onFinished;
        this.node = null;
        this.onFinished = null;
        if (typeof callback === 'function') callback({interrupted: false, ended: true});
      });
    };

    const promise = narrator.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(error => {
        SAGEIntegration.record('audio_blocked', {
          node_id: node.id,
          poi: node.poi,
          message: String(error)
        });
        const text = SAGEIntegration.narrationText(node);
        speak(text, () => {
          if (!this.completionRecorded) {
            this.completionRecorded = true;
            SAGEIntegration.markCompletionThreshold(node);
          }
          const callback = this.onFinished;
          this.node = null;
          this.onFinished = null;
          if (typeof callback === 'function') callback({interrupted: false, ended: true});
        });
      });
    }
  },

  interruptForDeparture() {
    if (!this.node || narrator.paused) return;
    const node = this.node;
    const currentTime = narrator.currentTime || 0;
    const resumeCount = (SAGEIntegration.resumeCounts.get(node.id) || 0) + 1;
    SAGEIntegration.resumeCounts.set(node.id, resumeCount);
    SAGEIntegration.narrationProgress.set(node.id, {
      currentTime,
      duration: narrator.duration || 0,
      fraction: narrator.duration ? currentTime / narrator.duration : 0
    });

    // Fade over 450 ms before pausing.
    const startVolume = narrator.volume;
    const started = performance.now();
    const fade = now => {
      const p = Math.min(1, (now - started) / 450);
      narrator.volume = startVolume * (1 - p);
      if (p < 1) {
        requestAnimationFrame(fade);
      } else {
        narrator.pause();
        narrator.volume = 1.0;

        if (resumeCount > 1 && !SAGEIntegration.visitorState.completed.has(node.id)) {
          SAGEIntegration.visitorState.dismissed.add(node.id);
          SAGEIntegration.record('dismissal', {
            node_id: node.id,
            poi: node.poi,
            reason: 'second_interruption'
          });
        }

        const callback = this.onFinished;
        this.node = null;
        this.onFinished = null;
        if (typeof callback === 'function') callback({interrupted: true, ended: false});
      }
    };
    requestAnimationFrame(fade);
  }
};

function stopNarration() {
  NarrationManager.stop('tour_stop');
}

function playNarration(id, text, onEnd = null, options = {}) {
  // Legacy hotspot fallback only. Corpus narration should use NarrationManager.playNode.
  if (/^NW\d{3}$/.test(id) && SAGEIntegration.corpus) {
    const node = SAGEIntegration.corpus.nodes.find(n => n.id === id);
    if (node) {
      NarrationManager.playNode(node, () => {
        if (typeof onEnd === 'function') onEnd();
      });
      return;
    }
  }
  speak(text, onEnd);
}

function standardNarration(id) {
  const raw = hotspotTexts[id][currentLanguage];
  return raw.replace(/\n+/g, ' ');
}

function playIntroSequence(onComplete = null) {
  const node = SAGEIntegration.corpus?.nodes?.find(n => n.id === 'NW001');
  if (!node) {
    if (typeof onComplete === 'function') onComplete();
    return;
  }

  let advanced = false;
  let watchdog = null;

  const advanceOnce = (reason) => {
    if (advanced) return;
    advanced = true;

    if (watchdog) {
      clearInterval(watchdog);
      watchdog = null;
    }

    if (!SAGEIntegration.visitorState.completed.has(node.id)) {
      SAGEIntegration.markCompletionThreshold(node);
    }

    SAGEIntegration.record('intro_advance', {
      node_id: node.id,
      reason,
      current_time_s: narrator.currentTime || 0,
      duration_s: narrator.duration || 0
    });

    if (typeof onComplete === 'function') onComplete();
  };

  NarrationManager.playNode(node, () => {
    advanceOnce('audio_ended_callback');
  });

  // Quest Browser has occasionally failed to deliver a reliable `ended`
  // callback for the opening MP3. The intro must never block SAGE startup.
  // As soon as NW001 is effectively finished, advance exactly once.
  watchdog = setInterval(() => {
    const duration = narrator.duration;
    const current = narrator.currentTime || 0;

    if (Number.isFinite(duration) && duration > 0) {
      const fraction = current / duration;

      if (fraction >= 0.97 || narrator.ended) {
        advanceOnce('intro_watchdog_near_end');
      }
    }
  }, 200);
}

function makeCanvasTexture(text, language, width = 520, height = 190) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = 'rgba(17,17,17,0.72)';
  roundRect(ctx, 0, 0, width, height, 26);
  ctx.fill();

  ctx.fillStyle = 'white';
  ctx.textBaseline = 'top';

  if (language === 'ar') {
    ctx.direction = 'rtl';
    ctx.textAlign = 'right';
    ctx.font = '22px Tahoma, Arial, sans-serif';
    drawWrappedText(ctx, text, width - 38, 26, width - 68, 36);
  } else {
    ctx.direction = 'ltr';
    ctx.textAlign = 'left';
    ctx.font = '21px Arial, sans-serif';
    drawWrappedText(ctx, text, 38, 26, width - 68, 36);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  return texture;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
  const paragraphs = text.split('\n');

  for (const paragraph of paragraphs) {
    if (paragraph.trim() === '') {
      y += lineHeight * 0.65;
      continue;
    }

    const words = paragraph.split(' ');
    let line = '';

    for (let i = 0; i < words.length; i++) {
      const testLine = line + words[i] + ' ';

      if (ctx.measureText(testLine).width > maxWidth && i > 0) {
        ctx.fillText(line.trim(), x, y);
        line = words[i] + ' ';
        y += lineHeight;
      } else {
        line = testLine;
      }
    }

    ctx.fillText(line.trim(), x, y);
    y += lineHeight;
  }
}

function setPanelText(panel, text, language) {
  const mesh = panel.getObject3D('mesh');
  if (!mesh) return;

  mesh.material.map = makeCanvasTexture(text, language);
  mesh.material.transparent = true;
  mesh.material.needsUpdate = true;
}

function showPrimaryHotspots(show) {
